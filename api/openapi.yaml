components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: foliopath_session
      description: |
        High-entropy, opaque session cookie backed by a revocable server-side
        session. It is HttpOnly and SameSite=Strict; deployments using HTTPS
        set Secure. The database stores no replayable plaintext token.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Session-bound token returned by setup, login, and session responses.
        It is required together with `cookieAuth` on authenticated
        state-changing operations. It must never be placed in a URL.

  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: |
        Browser origin. Setup and login have no session-bound CSRF token yet,
        so the server requires and validates this as same-origin before reading
        credentials or changing authentication state.
      schema:
        type: string
        format: uri
        maxLength: 2048
    LibraryIDParameter:
      name: libraryId
      in: path
      required: true
      description: Opaque media-library ID. It contains no path information.
      schema:
        $ref: '#/components/schemas/ResourceID'
    DirectoryIDParameter:
      name: directoryId
      in: path
      required: true
      description: Opaque indexed-directory ID. It contains no path information.
      schema:
        $ref: '#/components/schemas/ResourceID'
    AssetIDParameter:
      name: assetId
      in: path
      required: true
      description: Opaque indexed-media ID. It contains no path information.
      schema:
        $ref: '#/components/schemas/ResourceID'
    TagIDParameter:
      name: tagId
      in: path
      required: true
      description: Opaque application tag ID. It contains no media path information.
      schema:
        $ref: '#/components/schemas/ResourceID'
    AIModelIDParameter:
      name: modelId
      in: path
      required: true
      description: Opaque reviewed model ID with no filename or path semantics.
      schema:
        $ref: '#/components/schemas/ResourceID'
    AIModelCandidateIDParameter:
      name: candidateId
      in: path
      required: true
      description: Opaque, expiring candidate ID bound to one fixed-directory scan revision.
      schema:
        $ref: '#/components/schemas/ResourceID'
    AIOperationIDParameter:
      name: operationId
      in: path
      required: true
      description: Opaque model or semantic operation ID.
      schema:
        $ref: '#/components/schemas/ResourceID'
    PersonIDParameter:
      name: personId
      in: path
      required: true
      description: Opaque administrator-owned person ID with no identity semantics.
      schema:
        $ref: '#/components/schemas/ResourceID'
    FaceReviewIDParameter:
      name: reviewId
      in: path
      required: true
      description: Opaque bounded face-review audit ID eligible for guarded undo.
      schema:
        $ref: '#/components/schemas/ResourceID'
    SemanticQueryParameter:
      name: q
      in: query
      required: true
      description: |
        Chinese or English visual description. Outer Unicode whitespace is
        trimmed. Literal tokenizer control strings `</s>` and `<unk>` are
        rejected case-insensitively rather than interpreted as user text or
        model control tokens. The value is never logged, persisted, or encoded
        into cursors.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    OptionalLibraryIDParameter:
      name: libraryId
      in: query
      required: false
      description: Opaque media-library scope. Omit it to include all libraries.
      schema:
        $ref: '#/components/schemas/ResourceID'
    ScanIDParameter:
      name: scanId
      in: path
      required: true
      description: Opaque full-scan run ID.
      schema:
        $ref: '#/components/schemas/ResourceID'
    RemovalIDParameter:
      name: removalId
      in: path
      required: true
      description: Opaque library-removal operation ID.
      schema:
        $ref: '#/components/schemas/ResourceID'
    ParentDirectoryIDParameter:
      name: parentId
      in: query
      required: false
      description: Opaque parent directory ID. Omit it for the media-library root.
      schema:
        $ref: '#/components/schemas/ResourceID'
    DirectoryFilterParameter:
      name: directoryId
      in: query
      required: false
      description: Opaque directory ID that defines the browse or search root. Omit it for the media-library root.
      schema:
        $ref: '#/components/schemas/ResourceID'
    LibraryParentPathParameter:
      name: parent
      in: query
      required: false
      description: |
        Canonical path relative to `/library`, used only by the authenticated
        administrator path picker. Empty or omitted means `/library`. It is not
        a host path and is never accepted by media-content endpoints.
      schema:
        $ref: '#/components/schemas/AllowedRootRelativePath'
    CursorParameter:
      name: cursor
      in: query
      required: false
      description: |
        Opaque, versioned, integrity-protected keyset cursor containing a query
        fingerprint, final sort value, and stable resource-ID tie-breaker. It
        contains no plaintext filesystem path. A cursor from any different
        scope, filter, search, sort, or order fails with `invalid_cursor`;
        the server never falls back to the first page.
      schema:
        $ref: '#/components/schemas/Cursor'
    LimitParameter:
      name: limit
      in: query
      required: false
      description: Requested page size. Values above the maximum are rejected rather than silently producing an unbounded page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    RecursiveParameter:
      name: recursive
      in: query
      required: false
      description: Include media from all descendant directories of the selected browse root.
      schema:
        type: boolean
        default: false
    SearchQueryParameter:
      name: q
      in: query
      required: false
      description: |
        Plain-text filename/path search. Omit it to browse without search.
        Present values are trimmed, must remain non-empty, and follow the
        versioned literal-substring search profile; FTS operators are not exposed.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    DirectorySearchQueryParameter:
      name: q
      in: query
      required: false
      description: |
        Plain-text direct-child directory-name filter. Present values are
        trimmed, must remain non-empty, and follow the versioned Unicode NFKC,
        full-case-folded literal-substring profile. All normalized
        whitespace-separated terms must match the same direct-child name.
        Diacritics are preserved, short terms are valid, and punctuation or
        FTS syntax has no operator meaning.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    RequiredSearchQueryParameter:
      name: q
      in: query
      required: true
      description: |
        Required plain-text filename/path query across all libraries. It is
        trimmed, must remain non-empty, and follows the same versioned
        literal-substring profile as library search.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    KindFilterParameter:
      name: kind
      in: query
      required: false
      description: One or more media-kind filters. Omit it to include every supported kind.
      style: form
      explode: false
      schema:
        type: array
        uniqueItems: true
        maxItems: 3
        items:
          $ref: '#/components/schemas/AssetKind'
    TagSearchParameter:
      name: q
      in: query
      required: false
      description: Optional normalized literal substring filter over original tag names and reviewed Chinese/English aliases of AI categories associated in the requested library/media-kind scope. Manual names remain unchanged. Expansion is applied before keyset pagination.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    ModifiedFromParameter:
      name: modifiedFrom
      in: query
      required: false
      description: |
        Inclusive lower bound for filesystem modification time. It must be a
        UTC RFC 3339 instant and precede `modifiedBefore` when both are present.
      schema:
        $ref: '#/components/schemas/Timestamp'
    ModifiedBeforeParameter:
      name: modifiedBefore
      in: query
      required: false
      description: |
        Exclusive upper bound for filesystem modification time. It must be a
        UTC RFC 3339 instant and follow `modifiedFrom` when both are present.
      schema:
        $ref: '#/components/schemas/Timestamp'
    SortParameter:
      name: sort
      in: query
      required: false
      description: |
        Explicit sort field. When omitted, direct non-search browse uses `name`;
        recursive browse and every search use `modifiedAt`.
      schema:
        type: string
        enum: [name, modifiedAt, size]
    CurationSortParameter:
      name: sort
      in: query
      required: false
      description: Favorite pages default to `favoritedAt` descending.
      schema:
        type: string
        enum: [favoritedAt, modifiedAt, name, size]
        default: favoritedAt
    CuratedAssetSortParameter:
      name: sort
      in: query
      required: false
      description: Tagged-media pages default to filesystem modification time descending.
      schema:
        type: string
        enum: [modifiedAt, name, size]
        default: modifiedAt
    OrderParameter:
      name: order
      in: query
      required: false
      description: |
        Explicit sort direction. When omitted, `name` uses ascending and
        `modifiedAt` and `size` use descending.
      schema:
        type: string
        enum: [asc, desc]
    ThumbnailVariantParameter:
      name: variant
      in: query
      required: false
      description: |
        Bounded, server-defined transform variant. `grid` is the static image
        thumbnail or video poster. `storyboard` is an all-or-nothing 4–10 frame
        video sprite and returns `unsupported_media` when it does not apply.
      schema:
        type: string
        enum: [grid, storyboard]
        default: grid
    ThumbnailVersionParameter:
      name: v
      in: query
      required: false
      description: |
        Opaque source-bound cache version emitted by asset responses. Clients
        must preserve it when present so immutable browser entries cannot be
        reused after an asset ID is reassigned or its source changes. It is
        optional only for compatibility with previously emitted URLs.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated opaque key retained for at least 24 hours. Use a new
        key for a different logical action. Reuse with a different request body
        fails with `idempotency_conflict`. The server stores only a fixed-size
        digest of this value and never writes the plaintext key to logs.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from the latest GET. Missing values fail with 428 and stale values with 412.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      description: Representation validator from an earlier response.
      schema:
        type: string
        maxLength: 512
    IfModifiedSinceHeader:
      name: If-Modified-Since
      in: header
      required: false
      description: HTTP-date validator. If both validators are sent, If-None-Match takes precedence.
      schema:
        type: string
        maxLength: 128
    IfRangeHeader:
      name: If-Range
      in: header
      required: false
      description: Strong ETag or HTTP date controlling whether a Range request can return 206.
      schema:
        type: string
        maxLength: 512
    RangeHeader:
      name: Range
      in: header
      required: false
      description: |
        Exactly one byte range (`bytes=start-end`, `bytes=start-`, or
        `bytes=-suffixLength`). Multiple, malformed, and unsatisfiable ranges
        receive 416.
      schema:
        type: string
        maxLength: 128
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'

  headers:
    NoStore:
      description: Authentication state and credentials must not be stored by browsers or intermediaries.
      schema:
        type: string
        enum: [no-store]
    RequestID:
      description: Server-generated opaque correlation ID. Client-supplied values are not trusted.
      schema:
        type: string
        pattern: '^req_[A-Za-z0-9_-]+$'
        maxLength: 128
    RetryAfter:
      description: Non-negative delay in seconds before a bounded retry.
      schema:
        type: integer
        format: int32
        minimum: 0
    SessionCookie:
      description: |
        Opaque `foliopath_session` cookie with HttpOnly, SameSite=Strict,
        Path=/, bounded Max-Age, and Secure whenever HTTPS is in use.
      schema:
        type: string
    ExpiredSessionCookie:
      description: Expired `foliopath_session` cookie with Max-Age=0.
      schema:
        type: string
    IdempotencyReplayed:
      description: True only when this representation is a replay of a previously completed idempotent request.
      schema:
        type: boolean
    ETag:
      description: |
        Strong opaque representation validator. For a Library it changes when
        any represented field changes, including scan-derived status/counts.
      schema:
        type: string
        example: '"fp-8b51cdd5"'
    LastModified:
      description: Source modification time formatted as an HTTP date.
      schema:
        type: string
        example: Thu, 23 Jul 2026 12:00:00 GMT
    AcceptRanges:
      description: The original-media endpoint supports byte ranges.
      schema:
        type: string
        enum: [bytes]
    ContentRange:
      description: Exact bytes returned and complete source length.
      schema:
        type: string
        example: bytes 0-1048575/3145728
    UnsatisfiedContentRange:
      description: Complete source length for an unsatisfied range.
      schema:
        type: string
        example: bytes */3145728
    ContentLength:
      description: Number of response-body bytes, or full representation length for HEAD.
      schema:
        type: integer
        format: int64
        minimum: 0
    MediaContentType:
      description: Server-verified MIME type from the supported MVP media allowlist.
      schema:
        type: string
        enum:
          - image/jpeg
          - image/png
          - image/webp
          - image/gif
          - video/mp4
          - video/quicktime
          - video/x-matroska
          - video/x-msvideo
    InlineContentDisposition:
      description: |
        Safe inline disposition with a server-encoded filename. It never
        contains CR/LF or an unescaped media path.
      schema:
        type: string
        example: inline; filename*=UTF-8''IMG_0001.jpg
    NoSniff:
      description: Prevents browser MIME sniffing.
      schema:
        type: string
        enum: [nosniff]

  responses:
    DeletionFailure:
      description: The media-change request could not be completed. The response uses the shared error envelope with deletion-specific codes.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeletionErrorResponse'
    BadRequest:
      description: The request syntax, cursor, query combination, or encoded input is invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A valid administrator session is required or the session has expired.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF or same-origin validation failed. No protected action was executed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested opaque resource ID does not identify a visible resource.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        The request conflicts with durable state, such as closed setup,
        duplicate library name, overlapping root, active removal, offline
        source, terminal scan, or idempotency-key body mismatch.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: The supplied If-Match no longer identifies the current representation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: A current If-Match validator is required.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The JSON shape is valid but one or more values violate the accepted contract.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: A per-endpoint authentication, browse, scan, thumbnail, or media limit was reached.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected failure represented by a safe public code and request ID.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The requested optional capability is unavailable; core application readiness is unaffected.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FullMediaContent:
      description: Complete original supported media.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/MediaContentType'
        Content-Disposition:
          $ref: '#/components/headers/InlineContentDisposition'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        video/mp4:
          schema:
            type: string
            format: binary
        video/quicktime:
          schema:
            type: string
            format: binary
        video/x-matroska:
          schema:
            type: string
            format: binary
        video/x-msvideo:
          schema:
            type: string
            format: binary
    PartialMediaContent:
      description: Exact single byte range of original supported media.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Range:
          $ref: '#/components/headers/ContentRange'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/MediaContentType'
        Content-Disposition:
          $ref: '#/components/headers/InlineContentDisposition'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        video/mp4:
          schema:
            type: string
            format: binary
        video/quicktime:
          schema:
            type: string
            format: binary
        video/x-matroska:
          schema:
            type: string
            format: binary
        video/x-msvideo:
          schema:
            type: string
            format: binary
    MediaNotModified:
      description: The original-media representation has not changed. No body is sent.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    RangeNotSatisfiable:
      description: The single requested range is malformed, multiple, or unsatisfiable.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Range:
          $ref: '#/components/headers/UnsatisfiedContentRange'
        ETag:
          $ref: '#/components/headers/ETag'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    DeletionErrorCode:
      anyOf:
        - $ref: '#/components/schemas/ErrorCode'
        - type: string
          enum: [deletion_disabled, deletion_confirmation_required, deletion_confirmation_expired, deletion_busy, deletion_conflict, deletion_source_changed, deletion_not_found, deletion_permission_denied, deletion_unavailable]
    DeletionErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/DeletionErrorCode'
            message:
              $ref: '#/components/schemas/Error/properties/message'
            requestId:
              $ref: '#/components/schemas/Error/properties/requestId'
    "DeletionTarget":
      "type": "object"
      "additionalProperties": false
      "required": ["type", "id"]
      "properties":
        "type":
          "type": "string"
          "enum": ["asset", "directory"]
        "id":
          "type": "string"
          "minLength": 1
          "maxLength": 128
    "DeletionSettings":
      "type": "object"
      "additionalProperties": false
      "required": ["enabled", "recycleBinEnabled", "retentionDays", "available", "unavailableReason", "revision"]
      "properties":
        "enabled":
          "type": "boolean"
        "recycleBinEnabled":
          "type": "boolean"
        "retentionDays":
          "type": "integer"
          "format": "int64"
          "nullable": true
          "enum": [null, 7, 30, 90]
        "available":
          "type": "boolean"
        "unavailableReason":
          "type": "string"
          "nullable": true
          "enum": [null, "not_configured", "read_only", "unsupported", "storage_unavailable"]
        "revision":
          "type": "integer"
          "format": "int64"
          "minimum": 1
    "DeletionSettingsUpdate":
      "type": "object"
      "additionalProperties": false
      "required": ["enabled", "recycleBinEnabled", "retentionDays", "acknowledge"]
      "properties":
        "enabled":
          "type": "boolean"
        "recycleBinEnabled":
          "type": "boolean"
        "retentionDays":
          "type": "integer"
          "format": "int64"
          "nullable": true
          "enum": [null, 7, 30, 90]
        "acknowledge":
          "type": "boolean"
    "DeletionRetentionPreview":
      "type": "object"
      "additionalProperties": false
      "required": ["expiredEntries"]
      "properties":
        "expiredEntries":
          "type": "integer"
          "format": "int64"
          "minimum": 0
    "DeletionPreflightRequest":
      "type": "object"
      "additionalProperties": false
      "required": ["targets"]
      "properties":
        "targets":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DeletionTarget"
          "minItems": 1
          "maxItems": 200
    "DeletionSelection":
      "type": "object"
      "additionalProperties": false
      "required": ["target", "libraryId", "libraryName", "name", "relativePath", "kind", "blockedReason"]
      "properties":
        "target":
          "$ref": "#/components/schemas/DeletionTarget"
        "libraryId":
          "type": "string"
          "nullable": true
        "libraryName":
          "type": "string"
          "nullable": true
        "name":
          "type": "string"
          "nullable": true
        "relativePath":
          "type": "string"
          "nullable": true
        "kind":
          "type": "string"
          "enum": ["file", "directory", "archive"]
        "blockedReason":
          "type": "string"
          "nullable": true
          "enum": [null, "root", "archive_member", "offline", "changed", "missing", "busy", "unreadable", "unavailable"]
    "DeletionPreflight":
      "type": "object"
      "additionalProperties": false
      "required": ["id", "mode", "retentionDays", "canSubmit", "expiresAt", "items"]
      "properties":
        "id":
          "type": "string"
          "nullable": true
        "mode":
          "type": "string"
          "enum": ["permanent"]
        retentionDays:
          type: integer
          format: int64
          nullable: true
          enum: [null, 7, 30, 90]
        "canSubmit":
          "type": "boolean"
        "expiresAt":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DeletionSelection"
          "maxItems": 200
    "DeletionSubmit":
      "type": "object"
      "additionalProperties": false
      "required": ["preflightId", "confirmation"]
      "properties":
        "preflightId":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "confirmation":
          "type": "string"
          "enum": ["permanently_delete"]
    "DeletionOperationItem":
      "type": "object"
      "additionalProperties": false
      "required": ["id", "libraryId", "libraryName", "name", "relativePath", "kind", "state", "removedEntries", "errorCode", "trashEntryId"]
      "properties":
        "id":
          "type": "string"
        "libraryId":
          "type": "string"
        "libraryName":
          "type": "string"
        "name":
          "type": "string"
        "relativePath":
          "type": "string"
        "kind":
          "type": "string"
          "enum": ["file", "directory", "archive"]
        "state":
          "type": "string"
          "enum": ["queued", "running", "trashed", "restored", "deleted", "failed", "partial", "cancelled", "needs_attention"]
        "removedEntries":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "errorCode":
          "type": "string"
          "nullable": true
        "trashEntryId":
          "type": "string"
          "nullable": true
    "DeletionOperation":
      "type": "object"
      "additionalProperties": false
      "required": ["id", "kind", "state", "createdAt", "updatedAt", "revision", "canStop", "canResume", "items", "itemsNextCursor", "totalItems", "completedItems", "failedItems"]
      "properties":
        "id":
          "type": "string"
        "kind":
          "type": "string"
          "enum": ["trash", "permanent", "restore", "purge"]
        "state":
          "type": "string"
          "enum": ["queued", "running", "reconciling", "stopped", "partial", "failed", "succeeded", "needs_attention", "cancelled"]
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
        "revision":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "canStop":
          "type": "boolean"
        "canResume":
          "type": "boolean"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DeletionOperationItem"
          "maxItems": 50
        "itemsNextCursor":
          "type": "string"
          "nullable": true
        "totalItems":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "completedItems":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "failedItems":
          "type": "integer"
          "format": "int64"
          "minimum": 0
    "DeletionOperationPage":
      "type": "object"
      "additionalProperties": false
      "required": ["items", "nextCursor"]
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DeletionOperation"
          "maxItems": 50
        "nextCursor":
          "type": "string"
          "nullable": true
    "DeletionResumeRequest":
      "type": "object"
      "additionalProperties": false
      "required": ["confirmation"]
      "properties":
        "confirmation":
          "type": "string"
          "enum": ["continue"]
    OCRJob:
      type: object
      additionalProperties: false
      required: [id, libraryId, epoch, fingerprint, mode, state, revision, recorded, failed, attempts, errorCode]
      properties:
        id: {type: string, minLength: 8, maxLength: 128}
        libraryId: {$ref: '#/components/schemas/ResourceID'}
        epoch: {type: integer, format: int64, minimum: 1}
        fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        mode: {type: string, enum: [missing, retry_failed]}
        state: {type: string, enum: [queued, running, cancelling, succeeded, failed, cancelled]}
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Ownership revision; progress alone does not change this cancellation guard.
        recorded: {type: integer, format: int64, minimum: 0, description: Recorded attempts including definitive source failures; not images with text.}
        failed: {type: integer, format: int64, minimum: 0}
        attempts: {type: integer, format: int64, minimum: 0, maximum: 3}
        errorCode: {type: string, nullable: true, enum: [null, model_unavailable, identity_mismatch, inference_failed, output_limit, preprocess_failed, source_unavailable, interrupted]}
    OCRCoverage:
      type: object
      additionalProperties: false
      required: [eligible, ready, empty, failed, pending, stale]
      properties:
        eligible: {type: integer, format: int64, minimum: 0}
        ready: {type: integer, format: int64, minimum: 0}
        empty: {type: integer, format: int64, minimum: 0, description: Subset of ready with zero lines.}
        failed: {type: integer, format: int64, minimum: 0}
        pending: {type: integer, format: int64, minimum: 0}
        stale: {type: integer, format: int64, minimum: 0, description: Subset of pending with an outdated source in the selected generation.}
    OCRStatus:
      type: object
      additionalProperties: false
      required: [libraryId, enabled, clearing, revision, epoch, fingerprint, expectedFingerprint, state, coverage, latestJob]
      properties:
        libraryId: {$ref: '#/components/schemas/ResourceID'}
        enabled: {type: boolean}
        clearing: {type: boolean}
        revision: {type: integer, format: int64, minimum: 1}
        epoch: {type: integer, format: int64, minimum: 1}
        fingerprint: {type: string, nullable: true, pattern: '^[a-f0-9]{64}$'}
        expectedFingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [disabled, clearing, model_mismatch, queued, running, cancelling, pending, ready, degraded]}
        coverage: {$ref: '#/components/schemas/OCRCoverage'}
        latestJob:
          type: object
          allOf:
            - $ref: '#/components/schemas/OCRJob'
          nullable: true
    ResourceID:
      type: string
      description: Opaque stable resource identifier with no client-visible encoding semantics.
      minLength: 3
      maxLength: 128
      pattern: '^[A-Za-z][A-Za-z0-9_-]+$'
      example: asset_01JZ8YRAVQ

    NullableResourceID:
      type: string
      nullable: true
      description: Opaque stable resource identifier, or null when no related resource exists.
      minLength: 3
      maxLength: 128
      pattern: '^[A-Za-z][A-Za-z0-9_-]+$'

    Cursor:
      type: string
      description: |
        Opaque, integrity-protected, query-bound keyset cursor. It contains no
        plaintext media-library or filesystem path and must not be parsed by a client.
      minLength: 8
      maxLength: 2048

    NullableCursor:
      type: string
      nullable: true
      description: Opaque next-page cursor, or null when no next page exists.
      minLength: 8
      maxLength: 2048

    AllowedRootRelativePath:
      type: string
      description: |
        Canonical UTF-8 path relative to the allowed `/library` mount, carried
        as a JSON string rather than a URL path. The empty string means
        `/library` itself. It never begins with `/`, never uses a backslash,
        and contains no empty, dot, dot-dot, or NUL component. The server
        preserves safe literal percent characters, iteratively checks
        percent-decoded views, and rejects any view that produces invalid
        UTF-8, NUL, a separator, or a dot component; it never uses a decoded
        view for filesystem access. The schema pattern is an input-shape aid,
        not a security boundary. On Linux, actual filesystem access is anchored
        at the `/library` directory descriptor with openat2 and
        RESOLVE_BENEATH, RESOLVE_NO_SYMLINKS, and RESOLVE_NO_XDEV.
      minLength: 0
      maxLength: 4096
      pattern: '^(?!/)(?!.*\/$)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\x00).*$'
      example: family/2026

    LibraryRelativePath:
      type: string
      description: |
        Canonical path relative to one media-library root. It is display data,
        not a path accepted by original-content endpoints, and never contains a
        host or container absolute path.
      minLength: 0
      maxLength: 4096
      pattern: '^(?!/)(?!.*\/$)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\x00).*$'
      example: 2026/Shanghai/IMG_0001.jpg

    NullableLibraryRelativePath:
      type: string
      nullable: true
      description: Optional canonical media-library-relative path, never an absolute or host path.
      minLength: 0
      maxLength: 4096
      pattern: '^(?!/)(?!.*\/$)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\x00).*$'

    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp.

    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
      description: UTC RFC 3339 timestamp, or null when the event has not occurred.

    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, reasonCode]
      properties:
        status:
          type: string
          enum: [live]
        reasonCode:
          type: string
          nullable: true
          enum: [null]
          description: Always null when the process answers its liveness probe.

    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, reasonCode]
      properties:
        status:
          type: string
          enum: [ready]
        reasonCode:
          type: string
          nullable: true
          enum: [null]
          description: Always null when the service is ready.

    NotReadyResponse:
      type: object
      additionalProperties: false
      required: [status, reasonCode]
      properties:
        status:
          type: string
          enum: [not_ready]
        reasonCode:
          type: string
          enum:
            - application_data_unavailable
            - migration_failed
            - database_unavailable
            - shutting_down
          description: Safe operational reason for a failed readiness probe.

    AuthStatus:
      type: object
      additionalProperties: false
      required: [setupRequired, authenticationRequired]
      properties:
        setupRequired:
          type: boolean
          description: True only before the one-time administrator setup commits.
        authenticationRequired:
          type: boolean
          enum: [true]
          description: Stable MVP capability flag. Anonymous LAN mode is not supported.

    AssetExif:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key:
                type: string
                enum: [capturedAt, cameraMake, cameraModel, lensModel, aperture, exposureTime, iso, focalLength]
              value:
                type: string
                minLength: 1
                maxLength: 160
                description: Plain text from the original EXIF, without native type annotations. Capture time retains its recorded wall time; no timezone is invented.

    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: >-
            Password accepted only over the same-origin setup request and never logged or returned.
            It contains 8–128 Unicode characters, rejects control characters, and has no
            uppercase, digit, or symbol composition requirement.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: '#/components/schemas/LoginUsername'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true

    Administrator:
      type: object
      additionalProperties: false
      required: [id, username, displayName]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          $ref: '#/components/schemas/DisplayName'

    Account:
      type: object
      additionalProperties: false
      required: [id, username, displayName, revision, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic account representation revision used by the strong ETag.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AccountUpdate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Verified using the same constant-time credential path as login.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: |
            Contains 8–128 Unicode characters, rejects control characters, and
            has no uppercase, digit, or symbol composition requirement.

    DisplayName:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        NFC display text after trimming outer Unicode whitespace. Control
        characters are rejected. It is never used for authentication.

    Session:
      type: object
      additionalProperties: false
      required: [administrator, expiresAt, csrfToken]
      properties:
        administrator:
          $ref: '#/components/schemas/Administrator'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: |
            Opaque session-bound token for the `X-CSRF-Token` header. It is not
            an authentication credential by itself and must never be put in a URL.

    Username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[^\s\x00-\x1F\x7F]+$'
      description: |
        Administrator login name accepted during setup. The service stores its
        Unicode NFKC form for display and derives `username_key` by applying
        Unicode full case folding to that NFKC value. Validation is repeated
        after normalization. Authentication compares only `username_key`.

    LoginUsername:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Login identifier. The service derives the same NFKC plus Unicode
        full-case-folded `username_key` used during setup. Inputs that cannot
        identify the configured administrator use the same
        `invalid_credentials` response as an incorrect password.

    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - version
        - apiVersion
        - runtimeState
        - initialized
        - readOnlyMedia
        - supportedLocales
        - supportedMedia
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 128
          example: 0.1.0
        apiVersion:
          type: string
          enum: [v1]
        runtimeState:
          type: string
          enum: [ready, degraded]
          description: Degraded means the authenticated UI should inspect library and setting states.
        initialized:
          type: boolean
        readOnlyMedia:
          type: boolean
          enum: [true]
          deprecated: true
          description: Legacy v1 constant retained for response compatibility. Finite directory-entry mutations require the separate deletion settings capability; media content bytes remain immutable.
        supportedLocales:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [zh-CN, en]
        supportedMedia:
          $ref: '#/components/schemas/SupportedMedia'

    SupportedMedia:
      type: object
      additionalProperties: false
      required: [imageMimeTypes, videoMimeTypes, videoTranscoding]
      properties:
        imageMimeTypes:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [image/jpeg, image/png, image/webp, image/gif]
        videoMimeTypes:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [video/mp4, video/quicktime, video/x-matroska, video/x-msvideo]
        videoTranscoding:
          type: boolean
          enum: [false]

    Settings:
      type: object
      additionalProperties: false
      required:
        - scheduledScanIntervalHours
        - automaticDiscoveryEnabled
        - thumbnailCacheQuotaBytes
        - backgroundConcurrency
        - contentReadConcurrency
        - language
        - updatedAt
      properties:
        scheduledScanIntervalHours:
          type: integer
          format: int32
          minimum: 1
          maximum: 8760
          nullable: true
          default: 24
          description: Full-scan interval in hours. Null disables scheduled scans.
        automaticDiscoveryEnabled:
          type: boolean
          default: true
          description: |
            Enables the automatic-discovery fast path on supported Linux
            filesystems. Full creation/startup/manual/scheduled scans remain
            available when disabled.
        thumbnailCacheQuotaBytes:
          type: integer
          format: int64
          minimum: 1
          default: 10737418240
          description: Cache quota. Eviction also preserves the server's independent safe-free-space margin.
        backgroundConcurrency:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
          default: 2
          description: Maximum shared concurrency for scans, reconciliation, and derived-media work.
        contentReadConcurrency:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
          default: 8
          description: Maximum concurrent original-image and video content reads.
        language:
          $ref: '#/components/schemas/LanguagePreference'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    SettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        scheduledScanIntervalHours:
          type: integer
          format: int32
          minimum: 1
          maximum: 8760
          nullable: true
          description: Full-scan interval in hours. Null disables scheduled scans.
        automaticDiscoveryEnabled:
          type: boolean
          description: Enable or disable the automatic-discovery fast path.
        thumbnailCacheQuotaBytes:
          type: integer
          format: int64
          minimum: 1
        backgroundConcurrency:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
        contentReadConcurrency:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        language:
          $ref: '#/components/schemas/LanguagePreference'

    CacheSummary:
      type: object
      additionalProperties: false
      required:
        - usageBytes
        - quotaBytes
        - highWatermarkBytes
        - lowWatermarkBytes
        - availableBytes
        - safeFreeSpaceBytes
        - pressure
        - cleanup
      properties:
        usageBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total bytes represented by ready reconstructible thumbnail and poster state.
        quotaBytes:
          type: integer
          format: int64
          minimum: 1
        highWatermarkBytes:
          type: integer
          format: int64
          minimum: 0
          description: Quota pressure begins above this server-derived value.
        lowWatermarkBytes:
          type: integer
          format: int64
          minimum: 0
          description: Automatic eviction under quota pressure targets this value.
        availableBytes:
          type: integer
          format: int64
          minimum: 0
          description: Safe aggregate free bytes on application-data storage; no path is disclosed.
        safeFreeSpaceBytes:
          type: integer
          format: int64
          minimum: 0
          description: Reserved safety margin for SQLite and temporary writes.
        pressure:
          $ref: '#/components/schemas/CachePressure'
        cleanup:
          $ref: '#/components/schemas/CacheCleanup'

    CachePressure:
      type: string
      enum: [normal, quota, storage, quota_and_storage]

    CacheCleanup:
      type: object
      additionalProperties: false
      required:
        - status
        - requestedAt
        - startedAt
        - finishedAt
        - initialUsageBytes
        - remainingUsageBytes
        - reclaimedBytes
        - deletedEntries
        - errorCode
      properties:
        status:
          $ref: '#/components/schemas/CacheCleanupStatus'
        requestedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        startedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        finishedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        initialUsageBytes:
          type: integer
          format: int64
          minimum: 0
        remainingUsageBytes:
          type: integer
          format: int64
          minimum: 0
        reclaimedBytes:
          type: integer
          format: int64
          minimum: 0
        deletedEntries:
          type: integer
          format: int64
          minimum: 0
        errorCode:
          $ref: '#/components/schemas/CacheCleanupErrorCode'

    CacheCleanupStatus:
      type: string
      enum: [idle, queued, running, succeeded, failed]

    CacheCleanupErrorCode:
      type: string
      nullable: true
      description: Sanitized terminal reason. It never contains a path or raw storage error.
      enum: [cache_unavailable, storage_unavailable, internal_error]

    LanguagePreference:
      type: string
      enum: [browser, zh-CN, en]
      default: browser

    LibraryPathLocation:
      type: object
      additionalProperties: false
      required: [name, relativePath]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Display name. The root location uses the localized conceptual name for the media root.
        relativePath:
          $ref: '#/components/schemas/AllowedRootRelativePath'

    LibraryPathEntry:
      type: object
      additionalProperties: false
      required:
        - name
        - relativePath
        - hasChildren
        - selectable
        - selectionBlockedReason
        - conflictingLibraryId
        - conflictingLibraryName
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        relativePath:
          $ref: '#/components/schemas/AllowedRootRelativePath'
        hasChildren:
          type: boolean
          description: Best-effort direct-child hint; selecting still revalidates the directory.
        selectable:
          type: boolean
        selectionBlockedReason:
          type: string
          nullable: true
          enum:
            - overlapping_library
            - ancestor_of_library
            - descendant_of_library
            - unreadable
            - symlink
            - mount_boundary
            - unavailable
          description: |
            Null when selectable is true. `mount_boundary` means the entry
            crosses a descendant mount below `/library`; it never reveals the
            mount source, device identity, or a host path.
        conflictingLibraryId:
          $ref: '#/components/schemas/NullableResourceID'
        conflictingLibraryName:
          type: string
          nullable: true
          maxLength: 128
          description: Present only for a library-overlap reason; safe administrator-visible text.

    LibraryPathPage:
      type: object
      additionalProperties: false
      required: [location, breadcrumbs, items, nextCursor]
      properties:
        location:
          $ref: '#/components/schemas/LibraryPathLocation'
        breadcrumbs:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/LibraryPathLocation'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LibraryPathEntry'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    LibraryStatus:
      type: string
      enum: [pending, scanning, ready, offline, error]

    AutomaticDiscoveryStatus:
      type: string
      enum: [active, degraded, unsupported, disabled]

    AutomaticDiscoveryErrorCode:
      type: string
      nullable: true
      enum:
        - watch_unavailable
        - watch_resource_limit
        - watch_overflow
        - source_unavailable
        - internal_error

    Library:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - rootPath
        - displayPath
        - status
        - lastSuccessfulScanAt
        - latestScanId
        - assetCount
        - directoryCount
        - automaticDiscoveryStatus
        - automaticDiscoveryErrorCode
        - lastAutomaticDiscoveryAt
        - contentRevision
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 128
        rootPath:
          $ref: '#/components/schemas/AllowedRootRelativePath'
        displayPath:
          type: string
          minLength: 8
          maxLength: 4105
          pattern: '^/library(?:/.*)?$'
          readOnly: true
          description: |
            Server-built administrator label inside the container's allowed
            mount, never a host path and never accepted as request input.
          example: /library/family
        status:
          $ref: '#/components/schemas/LibraryStatus'
        lastSuccessfulScanAt:
          $ref: '#/components/schemas/NullableTimestamp'
        latestScanId:
          $ref: '#/components/schemas/NullableResourceID'
        assetCount:
          type: integer
          format: int64
          minimum: 0
          description: Snapshot from the last reliable index state.
        directoryCount:
          type: integer
          format: int64
          minimum: 0
          description: Snapshot including empty indexed directories.
        automaticDiscoveryStatus:
          $ref: '#/components/schemas/AutomaticDiscoveryStatus'
        automaticDiscoveryErrorCode:
          $ref: '#/components/schemas/AutomaticDiscoveryErrorCode'
        lastAutomaticDiscoveryAt:
          $ref: '#/components/schemas/NullableTimestamp'
        contentRevision:
          type: integer
          format: int64
          minimum: 1
          description: |
            Monotonic notification revision for this library. It is not used
            as a keyset cursor generation.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    CatalogState:
      type: object
      additionalProperties: false
      required: [contentRevision]
      properties:
        contentRevision:
          type: integer
          format: int64
          minimum: 1

    CreateLibraryRequest:
      type: object
      additionalProperties: false
      required: [name, rootPath]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Instance-unique name after server normalization.
        rootPath:
          $ref: '#/components/schemas/AllowedRootRelativePath'

    RenameLibraryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: New instance-unique name. A root path is deliberately not accepted.

    CreateLibraryResult:
      type: object
      additionalProperties: false
      required: [library, scan]
      properties:
        library:
          $ref: '#/components/schemas/Library'
        scan:
          $ref: '#/components/schemas/ScanRun'

    LibraryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Library'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    LibraryRemoval:
      type: object
      additionalProperties: false
      required:
        - id
        - libraryId
        - libraryName
        - status
        - createdAt
        - startedAt
        - finishedAt
        - errorCode
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        libraryName:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum: [queued, running, succeeded, failed]
          description: |
            A failed operation remains pollable and may be safely retried by
            the worker or by a later delete request with a new idempotency key.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        finishedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        errorCode:
          type: string
          nullable: true
          enum:
            - cleanup_interrupted
            - application_data_unavailable
            - internal_error
          description: Safe retry-oriented code. Original-media operations are never part of this workflow.

    ScanStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, offline, interrupted]

    ScanPhase:
      type: string
      enum: [queued, checking_root, walking, indexing, finalizing, completed]

    ScanTrigger:
      type: string
      enum: [library_created, startup, manual, scheduled]

    ScanFailureCode:
      type: string
      nullable: true
      description: Sanitized terminal reason. Null for queued, running, succeeded, and user-cancelled runs.
      enum:
        - library_root_unavailable
        - library_root_outside_allowed
        - library_root_symlink
        - library_root_mount_boundary
        - library_root_identity_changed
        - partial_tree_unreadable
        - scan_io_error
        - database_unavailable
        - scan_interrupted
        - internal_error

    ScanIssue:
      type: object
      additionalProperties: false
      required: [code, message, count, sampleRelativePath]
      properties:
        code:
          type: string
          enum:
            - unreadable_directory
            - unsupported_file
            - invalid_media
            - media_probe_failed
            - symlink_skipped
            - maintained_directory_skipped
            - source_changed
            - io_error
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Localizable and sanitized. Clients branch only on code.
        count:
          type: integer
          format: int64
          minimum: 1
        sampleRelativePath:
          $ref: '#/components/schemas/NullableLibraryRelativePath'

    ScanRun:
      type: object
      additionalProperties: false
      required:
        - id
        - libraryId
        - trigger
        - status
        - phase
        - generation
        - discoveredDirectories
        - discoveredAssets
        - processedAssets
        - skippedDirectories
        - skippedFiles
        - errorCount
        - issues
        - issuesTruncated
        - errorCode
        - progressRatio
        - createdAt
        - startedAt
        - finishedAt
        - cancelRequestedAt
        - canCancel
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        trigger:
          $ref: '#/components/schemas/ScanTrigger'
        status:
          $ref: '#/components/schemas/ScanStatus'
        phase:
          $ref: '#/components/schemas/ScanPhase'
        generation:
          type: integer
          format: int64
          minimum: 1
        discoveredDirectories:
          type: integer
          format: int64
          minimum: 0
        discoveredAssets:
          type: integer
          format: int64
          minimum: 0
        processedAssets:
          type: integer
          format: int64
          minimum: 0
        skippedDirectories:
          type: integer
          format: int64
          minimum: 0
        skippedFiles:
          type: integer
          format: int64
          minimum: 0
        errorCount:
          type: integer
          format: int64
          minimum: 0
        issues:
          type: array
          maxItems: 50
          description: Bounded aggregated safe summaries, not raw stderr or an unbounded log.
          items:
            $ref: '#/components/schemas/ScanIssue'
        issuesTruncated:
          type: boolean
          description: True when additional aggregated issue groups were omitted by the server-side limit.
        errorCode:
          $ref: '#/components/schemas/ScanFailureCode'
        progressRatio:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Null unless a reliable denominator exists.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        finishedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        cancelRequestedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        canCancel:
          type: boolean

    ScanPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ScanRun'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    MediaJobProgress:
      type: object
      additionalProperties: false
      required: [total, processed, queued, running, succeeded, failed]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        processed:
          type: integer
          format: int64
          minimum: 0
          description: Terminal jobs, equal to succeeded plus failed.
        queued:
          type: integer
          format: int64
          minimum: 0
        running:
          type: integer
          format: int64
          minimum: 0
        succeeded:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0

    MediaProcessingProgress:
      type: object
      additionalProperties: false
      required:
        - active
        - thumbnails
        - videoPreviews
        - videoPreviewsPendingEligibility
      properties:
        active:
          type: boolean
          description: True while either queue is active or video preview eligibility is still pending.
        thumbnails:
          $ref: '#/components/schemas/MediaJobProgress'
        videoPreviews:
          $ref: '#/components/schemas/MediaJobProgress'
        videoPreviewsPendingEligibility:
          type: integer
          format: int64
          minimum: 0
          description: Videos whose grid work or bounded storyboard admission must finish before the total is final.

    MediaJobErrorCode:
      type: string
      enum:
        - invalid_media
        - unsupported_media
        - media_processing_failed
        - media_processing_timeout
        - source_unavailable
        - cache_unavailable

    MediaFailure:
      type: object
      additionalProperties: false
      required:
        - id
        - libraryId
        - libraryName
        - assetId
        - relativePath
        - variant
        - errorCode
        - attempts
        - finishedAt
      properties:
        id:
          type: string
          pattern: '^mjob_[1-9][0-9]*$'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        libraryName:
          type: string
          minLength: 1
          maxLength: 128
        assetId:
          $ref: '#/components/schemas/ResourceID'
        relativePath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Library-relative path; never a host or allowed-root path.
        variant:
          type: string
          enum: [grid, storyboard]
        errorCode:
          $ref: '#/components/schemas/MediaJobErrorCode'
        attempts:
          type: integer
          minimum: 0
          maximum: 3
        finishedAt:
          type: string
          format: date-time
        latestAttempt:
          $ref: '#/components/schemas/MediaFailureAttempt'

    MediaFailureAttempt:
      type: object
      additionalProperties: false
      required:
        - attemptNumber
        - outcome
        - stage
        - reasonCode
        - tool
        - exitCode
        - durationMs
        - finishedAt
      properties:
        attemptNumber:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum: [succeeded, retry, permanent_failure]
        stage:
          type: string
          nullable: true
          enum: [source_read, probe, poster_extract, frame_extract, storyboard_compose, output_validation, cache_publish]
        reasonCode:
          type: string
          nullable: true
          enum: [time_limit_exceeded, invalid_media_data, missing_moov_atom, container_mismatch, decoder_unavailable, decode_failed, frame_unavailable, output_limit_exceeded, tool_failed, source_unavailable, source_too_large, cache_unavailable]
        tool:
          type: string
          nullable: true
          enum: [ffmpeg, ffprobe, libvips, filesystem, cache]
        exitCode:
          type: integer
          nullable: true
        durationMs:
          type: integer
          format: int64
          minimum: 0
        finishedAt:
          type: string
          format: date-time

    MediaFailureDetail:
      type: object
      additionalProperties: false
      required: [failure, attemptHistory]
      properties:
        failure:
          $ref: '#/components/schemas/MediaFailure'
        attemptHistory:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MediaFailureAttempt'

    MediaFailurePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, revision]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MediaFailure'
        nextCursor:
          type: string
          nullable: true
          pattern: '^mjob_[1-9][0-9]*$'
        revision:
          type: string
          nullable: true
          pattern: '^mfailrev_[1-9][0-9]*_[1-9][0-9]*$'
          description: Changes whenever the latest matching failure event changes, including a retry of an existing job.

    MediaFailureRetrySummary:
      type: object
      additionalProperties: false
      required: [requeued, remainingEligible, permanentFailures]
      properties:
        requeued:
          type: integer
          format: int64
          minimum: 0
        remainingEligible:
          type: integer
          format: int64
          minimum: 0
        permanentFailures:
          type: integer
          format: int64
          minimum: 0
          deprecated: true
          description: Always zero; manual missing/all actions include terminal failures.

    SystemEventLevel:
      type: string
      enum: [info, warning, error]

    SystemEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - level
        - module
        - eventCode
        - occurredAt
        - requestId
        - method
        - routePattern
        - statusCode
        - durationMs
      properties:
        id:
          type: string
          pattern: '^sevt_[1-9][0-9]*$'
        level:
          $ref: '#/components/schemas/SystemEventLevel'
        module:
          type: string
          minLength: 1
          maxLength: 64
        eventCode:
          type: string
          minLength: 1
          maxLength: 128
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
          maxLength: 128
        method:
          type: string
          nullable: true
          maxLength: 16
        routePattern:
          type: string
          nullable: true
          maxLength: 512
        statusCode:
          type: integer
          nullable: true
          minimum: 100
          maximum: 599
        durationMs:
          type: integer
          format: int64
          nullable: true
          minimum: 0

    SystemEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SystemEvent'
        nextCursor:
          type: string
          nullable: true
          pattern: '^sevt_[1-9][0-9]*$'

    ReleaseSummary:
      type: object
      additionalProperties: false
      required: [version, name, summary, notes, publishedAt, url]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        summary:
          type: string
          maxLength: 500
        notes:
          type: string
          description: Bounded Markdown release notes from the official stable GitHub Release.
          maxLength: 20000
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          maxLength: 2048

    ReleaseInformation:
      type: object
      additionalProperties: false
      required:
        - currentVersion
        - latestVersion
        - updateAvailable
        - checkedAt
        - releases
      properties:
        currentVersion:
          type: string
          minLength: 1
          maxLength: 128
        latestVersion:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        updateAvailable:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        releases:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReleaseSummary'

    Breadcrumb:
      type: object
      additionalProperties: false
      description: |
        One indexed location in a root-to-current breadcrumb chain. The root
        uses the media-library display name and an empty relative path.
      required: [id, name, relativePath]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 255
        relativePath:
          $ref: '#/components/schemas/LibraryRelativePath'

    Directory:
      type: object
      additionalProperties: false
      description: |
        Indexed directory snapshot. For the library root, `name` is derived
        from the current library display name, `relativePath` is empty, and
        `parentId` is null. Non-root names come from indexed directory entries.
        Counts are from the last reliable finalized generation while a scan is
        running or the library is offline.
      required:
        - id
        - libraryId
        - parentId
        - name
        - relativePath
        - directAssetCount
        - recursiveAssetCount
        - hasChildren
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        parentId:
          $ref: '#/components/schemas/NullableResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 255
        relativePath:
          $ref: '#/components/schemas/LibraryRelativePath'
        directAssetCount:
          type: integer
          format: int64
          minimum: 0
        recursiveAssetCount:
          type: integer
          format: int64
          minimum: 0
        hasChildren:
          type: boolean
        archivePath:
          type: string
          nullable: true
          maxLength: 4096
          description: Library-relative containing ZIP or 7z path; null for a physical directory. An archive root has relativePath equal to archivePath.
        archiveStatus:
          type: string
          nullable: true
          enum: [ready, unreadable, encrypted, unsupported, limit_exceeded, null]
          description: Containing archive readability. Failed archives retain previously indexed members until a successful scan can reconcile them.
        coverAssetId:
          allOf:
            - $ref: '#/components/schemas/NullableResourceID'
          description: Asset with a current ready grid thumbnail from this directory or its descendants; null when none is available. Prefer direct assets in natural filename order, then descendants in relative-path order. Archive roots retain natural member filename order.

    DirectoryDetail:
      type: object
      additionalProperties: false
      description: Indexed directory plus its complete safe root-to-current breadcrumb chain.
      required:
        - id
        - libraryId
        - parentId
        - name
        - relativePath
        - directAssetCount
        - recursiveAssetCount
        - hasChildren
        - breadcrumbs
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        parentId:
          $ref: '#/components/schemas/NullableResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 255
        relativePath:
          $ref: '#/components/schemas/LibraryRelativePath'
        directAssetCount:
          type: integer
          format: int64
          minimum: 0
        recursiveAssetCount:
          type: integer
          format: int64
          minimum: 0
        hasChildren:
          type: boolean
        archivePath:
          type: string
          nullable: true
          maxLength: 4096
          description: Library-relative containing ZIP or 7z path; null for a physical directory. An archive root has relativePath equal to archivePath.
        archiveStatus:
          type: string
          nullable: true
          enum: [ready, unreadable, encrypted, unsupported, limit_exceeded, null]
          description: Containing archive readability. Failed archives retain previously indexed members until a successful scan can reconcile them.
        coverAssetId:
          allOf:
            - $ref: '#/components/schemas/NullableResourceID'
          description: Asset with a current ready grid thumbnail from this directory or its descendants; null when none is available. Prefer direct assets in natural filename order, then descendants in relative-path order. Archive roots retain natural member filename order.
        breadcrumbs:
          type: array
          minItems: 1
          maxItems: 2049
          description: |
            Ordered root-to-current, inclusive. The 2049-item response bound
            covers the root plus 2048 one-character path components within the
            4096-character relative-path bound.
          items:
            $ref: '#/components/schemas/Breadcrumb'

    DirectoryPage:
      type: object
      additionalProperties: false
      description: |
        Direct indexed children only; the selected parent is never repeated in
        `items`. The Library resource supplies pending/scanning/offline state.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Directory'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    AssetKind:
      type: string
      enum: [image, animated, video]

    ProbeStatus:
      type: string
      enum: [pending, ready, failed, unsupported]

    PlaybackStatus:
      type: string
      enum: [playable, unsupported_codec, not_applicable, unknown]

    SourceAvailability:
      type: string
      enum: [available, offline, missing, unreadable]

    ThumbnailReference:
      type: object
      additionalProperties: false
      required: [status, url, errorCode]
      properties:
        status:
          type: string
          enum: [pending, ready, failed, unavailable]
        url:
          type: string
          nullable: true
          pattern: '^/api/v1/assets/[A-Za-z][A-Za-z0-9_-]+/thumbnail\?variant=grid$'
          description: Same-origin relative URL, present only when status is ready.
        errorCode:
          type: string
          nullable: true
          enum:
            - source_offline
            - source_missing
            - unsupported_media
            - invalid_media
            - thumbnail_failed
            - media_processing_timeout
          description: Safe stable code when status is failed or unavailable.

    StoryboardReference:
      type: object
      additionalProperties: false
      description: |
        Derived video storyboard state. `ready` requires a URL and every layout
        field. `pending`, `failed`, `unavailable`, and `not_applicable` require
        all URL/layout fields to be null. Non-video assets and videos shorter
        than two seconds use `not_applicable`. A storyboard failure never
        changes the grid poster, probe, playback, or source-availability state.
      required:
        - status
        - url
        - errorCode
        - frameCount
        - columns
        - rows
        - cellWidth
        - cellHeight
      properties:
        status:
          type: string
          enum: [pending, ready, failed, unavailable, not_applicable]
        url:
          type: string
          nullable: true
          pattern: '^/api/v1/assets/[A-Za-z][A-Za-z0-9_-]+/thumbnail\\?variant=storyboard$'
          description: Same-origin relative URL, present only when status is ready.
        errorCode:
          type: string
          nullable: true
          enum:
            - source_offline
            - source_missing
            - unsupported_media
            - invalid_media
            - thumbnail_failed
            - media_processing_timeout
          description: Safe stable code when status is failed or unavailable.
        frameCount:
          type: integer
          format: int32
          minimum: 4
          maximum: 10
          enum: [4, 10]
          nullable: true
        columns:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        rows:
          type: integer
          format: int32
          minimum: 1
          maximum: 2
          nullable: true
        cellWidth:
          type: integer
          format: int32
          minimum: 1
          maximum: 320
          nullable: true
        cellHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 320
          nullable: true

    TagLocalization:
      type: object
      additionalProperties: false
      description: Reviewed AI category display metadata only; never rewrites name, tag ID, manual text or curation. Omitted for unknown/manual associations and mixed/manual/unassigned global tags. Locale is a browser preference, not an inference setting.
      required: [key, zhCN, en]
      properties:
        key:
          type: string
          maxLength: 32
          pattern: '^[a-z]+(_[a-z]+)*$'
        zhCN:
          type: string
          minLength: 1
          maxLength: 32
        en:
          type: string
          minLength: 1
          maxLength: 32

    Tag:
      type: object
      additionalProperties: false
      required: [id, name, assetCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 32
        assetCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        localization:
          $ref: '#/components/schemas/TagLocalization'

    AssetTag:
      type: object
      additionalProperties: false
      description: A per-image association; manual source wins over automatic updates. Global tag vocabulary has no source.
      required: [id, name, assetCount, createdAt, updatedAt, source]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 32
        assetCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        source:
          type: string
          enum: [manual, ai]
        localization:
          $ref: '#/components/schemas/TagLocalization'

    TagPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Tag'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    TagNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Raw input before server-owned Unicode normalization; normalized display length is at most 32 code points.

    FavoriteUpdate:
      type: object
      additionalProperties: false
      required: [favorite]
      properties:
        favorite:
          type: boolean

    ReplaceAssetTagsRequest:
      type: object
      additionalProperties: false
      description: >-
        Differential manual edit with revision CAS. Unchanged associations retain their source.
        Removed names are persistently suppressed for this image; explicitly added names become
        manual and clear same-name suppression. AI reruns cannot undo these changes.
      required: [tagIds]
      properties:
        tagIds:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/ResourceID'

    AssetCuration:
      type: object
      additionalProperties: false
      required: [assetId, favorite, favoritedAt, tags, revision]
      properties:
        assetId:
          $ref: '#/components/schemas/ResourceID'
        favorite:
          type: boolean
        favoritedAt:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AssetTag'
        revision:
          type: integer
          format: int64
          minimum: 1

    CuratedAsset:
      type: object
      additionalProperties: false
      required: [asset, curation]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        curation:
          $ref: '#/components/schemas/AssetCuration'

    CuratedAssetPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, counts]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CuratedAsset'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
        counts:
          $ref: '#/components/schemas/AssetCounts'

    Asset:
      type: object
      additionalProperties: false
      description: |
        Indexed media snapshot. `directoryId` may identify the indexed library
        root, whose DirectoryDetail is always serializable under the root
        representation rules. Paths are display-only and library-relative.
      required:
        - id
        - libraryId
        - libraryName
        - directoryId
        - name
        - relativePath
        - kind
        - mimeType
        - sizeBytes
        - width
        - height
        - durationMs
        - modifiedAt
        - probeStatus
        - playbackStatus
        - sourceAvailability
        - favorite
        - thumbnail
        - storyboard
      properties:
        archiveMember:
          type: boolean
          enum: [true]
          description: Present and true for read-only ZIP/7z member assets; whole-archive actions belong to their containing directory.

        searchSources:
          type: array
          maxItems: 2
          uniqueItems: true
          description: Present on literal search results only. Catalog-owned filename/parent-directory evidence; not semantic inference.
          items:
            type: string
            enum: [filename, path]
        id:
          $ref: '#/components/schemas/ResourceID'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        libraryName:
          type: string
          minLength: 1
          maxLength: 128
          description: Safe display name needed to distinguish cross-library search results.
        directoryId:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 255
        relativePath:
          $ref: '#/components/schemas/LibraryRelativePath'
        kind:
          $ref: '#/components/schemas/AssetKind'
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
            - video/mp4
            - video/quicktime
            - video/x-matroska
            - video/x-msvideo
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        width:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        height:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        durationMs:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        modifiedAt:
          $ref: '#/components/schemas/Timestamp'
        probeStatus:
          $ref: '#/components/schemas/ProbeStatus'
        playbackStatus:
          $ref: '#/components/schemas/PlaybackStatus'
        sourceAvailability:
          $ref: '#/components/schemas/SourceAvailability'
        favorite:
          type: boolean
          description: Application-only favorite projection; the original media is never modified.
        thumbnail:
          $ref: '#/components/schemas/ThumbnailReference'
        storyboard:
          $ref: '#/components/schemas/StoryboardReference'

    AssetPage:
      type: object
      additionalProperties: false
      description: |
        Stable keyset page from the preserved index. `nextCursor` is null only
        when no further item exists for this query and reliable generation.
      required: [items, nextCursor, counts]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Asset'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
        counts:
          $ref: '#/components/schemas/AssetCounts'

    AssetCounts:
      type: object
      additionalProperties: false
      description: |
        Complete counts for the selected scope and text/date filters, before
        applying the media-kind filter. Animated images are included in images.
      required: [all, images, videos]
      properties:
        all:
          type: integer
          format: int64
          minimum: 0
        images:
          type: integer
          format: int64
          minimum: 0
        videos:
          type: integer
          format: int64
          minimum: 0

    ThumbnailPending:
      type: object
      additionalProperties: false
      required: [assetId, variant, status, retryAfterMs]
      properties:
        assetId:
          $ref: '#/components/schemas/ResourceID'
        variant:
          type: string
          enum: [grid, storyboard]
        status:
          type: string
          enum: [queued, running]
        retryAfterMs:
          type: integer
          format: int32
          minimum: 100
          maximum: 60000

    AIModelProxySettings:
      type: object
      additionalProperties: false
      required: [mode, proxyUrl, revision]
      properties:
        mode:
          type: string
          enum: [inherit, direct, custom]
        proxyUrl:
          type: string
          maxLength: 2048
          description: Credential-free proxy origin; empty unless custom. Never a download URL.
        revision:
          type: integer
          format: int64
          minimum: 1

    AIModelProxySnapshot:
      type: object
      additionalProperties: false
      required: [mode, proxyUrl, revision, deploymentConfigured, effectiveMode]
      properties:
        mode:
          type: string
          enum: [inherit, direct, custom]
        proxyUrl:
          type: string
          maxLength: 2048
          description: Credential-free proxy origin; empty unless custom. Never a download URL.
        revision:
          type: integer
          format: int64
          minimum: 1
        deploymentConfigured:
          type: boolean
        effectiveMode:
          type: string
          enum: [direct, proxy]

    AIModelProxyTestResult:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean

    AIModelDownloadPage:
      type: object
      additionalProperties: false
      required: [items, runtimeAvailable]
      properties:
        presets:
          type: array
          maxItems: 16
          description: Built-in informational candidates, not installable downloads. Missing in older servers.
          items:
            $ref: '#/components/schemas/AIModelPreset'
        runtimeAvailable:
          type: boolean
          description: Semantic inference dependencies are compiled into this build; activation still validates the model.
        items:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/AIModelDownload'

    AIModelPreset:
      type: object
      additionalProperties: false
      required: [id, name, sourceLabel, purpose, readiness]
      properties:
        id:
          type: string
        name:
          type: string
        sourceLabel:
          type: string
        purpose:
          type: string
          enum: [semantic_image_text, face_detection_embedding]
        readiness:
          type: string
          enum: [package_pending, adapter_pending]

    AIModelDownload:
      type: object
      additionalProperties: false
      required: [id, name, sourceLabel, purpose, version, licenseId, packageSizeBytes, compatibility, installedModelId, operation]
      properties:
        id:
          type: string
        name:
          type: string
        sourceLabel:
          type: string
        purpose:
          type: string
          enum: [semantic_image_text, face_detection_embedding]
        version:
          type: string
        licenseId:
          type: string
        packageSizeBytes:
          type: integer
          format: int64
          minimum: 1
        compatibility:
          type: string
          enum: [compatible, architecture_mismatch]
        installedModelId:
          $ref: '#/components/schemas/NullableResourceID'
        operation:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AIModelOperation'

    AIPreparation:
      type: object
      additionalProperties: false
      required: [state, completedFiles, totalFiles, completedBytes, totalBytes]
      properties:
        state:
          type: string
          enum: [disabled, unavailable, preparing, downloading, loading, ready, failed]
        completedFiles:
          type: integer
          format: int64
          minimum: 0
          maximum: 512
        totalFiles:
          type: integer
          format: int64
          minimum: 0
          maximum: 512
        completedBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 8589934592
        totalBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 8589934592

    AIModelPage:
      type: object
      additionalProperties: false
      required: [items, activeModelId, activeFaceModelId, revision]
      properties:
        items:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/AIModel'
        activeModelId:
          $ref: '#/components/schemas/NullableResourceID'
        activeFaceModelId:
          $ref: '#/components/schemas/NullableResourceID'
        revision:
          type: integer
          format: int64
          minimum: 1

    AIModel:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - version
        - architecture
        - storageMode
        - state
        - availabilityRevision
        - packageSizeBytes
        - licenseId
        - active
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        purpose:
          type: string
          enum: [semantic_image_text, face_detection_embedding]
        version:
          type: string
          minLength: 1
          maxLength: 64
        architecture:
          type: string
          enum: [amd64, arm64]
        storageMode:
          type: string
          description: Service models are deployment-owned; legacy file installation and activation endpoints do not accept them.
          enum: [managed, direct, service]
        state:
          type: string
          enum: [installed, available, unavailable]
        availabilityRevision:
          type: integer
          format: int64
          minimum: 1
        packageSizeBytes:
          type: integer
          format: int64
          minimum: 1
        licenseId:
          type: string
          minLength: 1
          maxLength: 128
          description: Reviewed license identifier, not arbitrary package text.
        active:
          type: boolean

    AIModelCandidateScan:
      type: object
      additionalProperties: false
      required: [revision, scannedAt, candidates, truncated]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        scannedAt:
          $ref: '#/components/schemas/Timestamp'
        candidates:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/AIModelCandidate'
        truncated:
          type: boolean
          description: True when the bounded scan found more entries than may be reported.

    AIModelCandidate:
      type: object
      additionalProperties: false
      required: [id, purpose, version, architecture, packageSizeBytes, licenseId, compatibility]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        purpose:
          type: string
          enum: [semantic_image_text, unknown]
        version:
          type: string
          minLength: 1
          maxLength: 64
        architecture:
          type: string
          enum: [amd64, arm64, unknown]
        packageSizeBytes:
          type: integer
          format: int64
          minimum: 0
        licenseId:
          type: string
          minLength: 1
          maxLength: 128
        compatibility:
          type: string
          enum: [compatible, unknown_package, wrong_architecture, invalid_manifest, unsafe_source]

    InstallAIModelRequest:
      type: object
      additionalProperties: false
      required: [storageMode]
      properties:
        storageMode:
          type: string
          enum: [managed, direct]

    AIModelOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - state
        - phase
        - completedItems
        - totalItems
        - revision
        - errorCode
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        kind:
          type: string
          enum:
            - model_install
            - model_activate
            - semantic_missing
            - semantic_rebuild
            - semantic_clear
            - tag_suggestion_missing
            - tag_suggestion_rebuild
            - tag_review_clear
            - automatic_tags_missing
            - automatic_tags_rebuild
            - video_semantic_missing
            - video_semantic_rebuild
            - face_missing
            - face_rebuild
            - face_derived_clear
            - face_manual_clear
        state:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled]
        phase:
          type: string
          enum: [queued, scanning, verifying, copying, loading, building, detecting, clustering, validating, clearing, finalizing, completed]
        completedItems:
          type: integer
          format: int64
          minimum: 0
          description: Managed model_install reports received bytes; other operation kinds report processed items.
        totalItems:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Managed model_install reports manifest package bytes; null means the total is not yet known.
        revision:
          type: integer
          format: int64
          minimum: 1
        errorCode:
          type: string
          nullable: true
          enum:
            - model_candidate_stale
            - download_failed
            - model_incompatible
            - model_source_unavailable
            - model_source_unsafe
            - model_unavailable
            - model_invalid_output
            - vocabulary_unavailable
            - storyboard_not_ready
            - face_model_unavailable
            - library_not_ready
            - library_scanning
            - library_offline
            - face_disabled
            - insufficient_space
            - source_offline
            - source_missing
            - source_unreadable
            - operation_interrupted
            - cancelled
            - internal_error
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AutomaticTagLibrarySettings:
      type: object
      additionalProperties: false
      required: [libraryId, enabled, revision, state, offline, model, coverage, activeOperationId]
      properties:
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum: [disabled, awaiting_model, building, ready, degraded]
        offline:
          type: boolean
        model:
          type: object
          nullable: true
          additionalProperties: false
          required: [identity, displayName, protocol]
          properties:
            identity:
              type: string
              pattern: '^[a-f0-9]{64}$'
            displayName:
              type: string
            protocol:
              type: string
              enum: [foliopath-tag-v1]
        coverage:
          type: object
          additionalProperties: false
          required: [eligible, completed, failed, stale, revision]
          properties:
            eligible:
              type: integer
              format: int64
              minimum: 0
            completed:
              type: integer
              format: int64
              minimum: 0
            failed:
              type: integer
              format: int64
              minimum: 0
            stale:
              type: integer
              format: int64
              minimum: 0
            revision:
              type: integer
              format: int64
              minimum: 0
        activeOperationId:
          $ref: '#/components/schemas/NullableResourceID'

    SemanticLibrarySettings:
      type: object
      description: >-
        Recorded image indexing settings and coverage for the active generation.
        Model unavailability does not erase or hide recorded coverage. The state and
        coverage describe indexing, not model health; enabling analysis still requires
        an available active model.
      additionalProperties: false
      required: [libraryId, enabled, state, revision, activeGenerationId, coverage]
      properties:
        coverageRecorded:
          type: boolean
          description: >-
            Whether coverage has a stored progress row for the active generation.
            False means unknown, not zero candidates or complete; coverage.complete
            is false in this case. Omitted only by older servers.
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        enabled:
          type: boolean
        state:
          type: string
          enum: [disabled, awaiting_model, building, ready, degraded, clearing]
        revision:
          type: integer
          format: int64
          minimum: 1
        activeGenerationId:
          $ref: '#/components/schemas/NullableResourceID'
        coverage:
          $ref: '#/components/schemas/SemanticCoverage'

    SemanticLibrarySettingsUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean

    SemanticCoverage:
      type: object
      additionalProperties: false
      required: [eligible, completed, failed, stale, revision, complete]
      properties:
        eligible:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        stale:
          type: integer
          format: int64
          minimum: 0
        revision:
          type: integer
          format: int64
          minimum: 1
        complete:
          type: boolean
          description: True only when every currently eligible image has a reliable current-generation result.

    SemanticJobRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [missing, all]

    ClearSemanticDataRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [clear_semantic_data]

    FusedSearchPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, semanticState, coverage, ocrState, ocrCoverage]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [asset, sources, semanticScore, ocr]
            properties:
              asset:
                $ref: '#/components/schemas/Asset'
              sources:
                type: array
                minItems: 1
                maxItems: 4
                uniqueItems: true
                items:
                  type: string
                  enum: [filename, path, semantic, ocr]
              ocr:
                type: array
                nullable: true
                maxItems: 8
                description: Present only for OCR source. Original-text excerpts, not HTML or a complete transcript; line is 1-based recognition order, not a page number. Scores are not exposed.
                items:
                  type: object
                  additionalProperties: false
                  required: [line, text]
                  properties:
                    line: {type: integer, minimum: 1, maximum: 128}
                    text: {type: string, minLength: 1, maxLength: 162}
              semanticScore:
                type: number
                format: float
                nullable: true
                description: Actual cosine for semantic evidence only; never a confidence percentage.
        ocrState:
          type: string
          enum: [available, disabled, not_requested]
          description: Available means deployment configured, not all images indexed. Stored OCR search does not require live inference.
        ocrCoverage:
          type: object
          nullable: true
          additionalProperties: false
          required: [eligible, ready, failed]
          description: Current scope and enabled ready libraries only; ready includes blank images, failed excludes pending/stale. eligible minus ready minus failed is pending or stale.
          properties:
            eligible: {type: integer, format: int64, minimum: 0}
            ready: {type: integer, format: int64, minimum: 0}
            failed: {type: integer, format: int64, minimum: 0}
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
        semanticState:
          type: string
          enum: [ready, disabled, offline, unavailable, unsupported_query, not_requested]
        coverage:
          type: object
          allOf:
            - $ref: '#/components/schemas/SemanticSearchCoverage'
          nullable: true

    SemanticAssetPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, coverage]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Asset'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
        coverage:
          $ref: '#/components/schemas/SemanticSearchCoverage'

    SemanticSearchCoverage:
      type: object
      additionalProperties: false
      required: [eligible, completed, failed, stale, complete, excludedLibraries]
      properties:
        eligible:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        stale:
          type: integer
          format: int64
          minimum: 0
        complete:
          type: boolean
        excludedLibraries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SemanticExcludedLibrary'

    SemanticExcludedLibrary:
      type: object
      additionalProperties: false
      required: [libraryId, reason]
      properties:
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        reason:
          type: string
          enum: [disabled, offline, model_unavailable, not_ready]

    AITagVocabulary:
      type: object
      additionalProperties: false
      required: [revision, entries, publishedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        entries:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AITagVocabularyEntry'
        publishedAt:
          $ref: '#/components/schemas/Timestamp'

    AITagVocabularyEntry:
      type: object
      additionalProperties: false
      required: [tagId, name]
      properties:
        tagId:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Existing administrator-owned tag display name; never model-generated free text.

    AITagVocabularyUpdate:
      type: object
      additionalProperties: false
      required: [tagIds]
      properties:
        tagIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceID'

    AITagSuggestionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, coverage]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AITagSuggestion'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
        coverage:
          $ref: '#/components/schemas/DerivedCoverage'

    AITagSuggestion:
      type: object
      additionalProperties: false
      required: [id, libraryId, asset, tag, confidence, status, generationId, vocabularyRevision, revision, reviewedAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        asset:
          $ref: '#/components/schemas/Asset'
        tag:
          $ref: '#/components/schemas/AITagVocabularyEntry'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        status:
          type: string
          enum: [pending, accepted, dismissed]
        generationId:
          $ref: '#/components/schemas/ResourceID'
        vocabularyRevision:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 1
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    AITagSuggestionReviewRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [suggestionId, action, expectedSuggestionRevision, expectedCurationRevision]
            properties:
              suggestionId:
                $ref: '#/components/schemas/ResourceID'
              action:
                type: string
                enum: [accept, dismiss]
              expectedSuggestionRevision:
                type: integer
                format: int64
                minimum: 1
              expectedCurationRevision:
                type: integer
                format: int64
                minimum: 1

    AITagSuggestionReviewResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [suggestionId, outcome, revision]
            properties:
              suggestionId:
                $ref: '#/components/schemas/ResourceID'
              outcome:
                type: string
                enum: [accepted, dismissed, conflict]
              revision:
                type: integer
                format: int64
                minimum: 1

    ClearTagSuggestionReviewsRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [clear_tag_suggestion_reviews]

    SemanticVideoPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, coverage]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SemanticVideoHit'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
        coverage:
          $ref: '#/components/schemas/DerivedCoverage'

    SemanticVideoHit:
      type: object
      additionalProperties: false
      required: [asset, score, matchedFrame]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        score:
          type: number
          format: float
          minimum: -1
          maximum: 1
          description: Finite cosine score; clients must not display it as a probability.
        matchedFrame:
          type: object
          additionalProperties: false
          required: [ordinal, timestampMs, planSize]
          properties:
            ordinal:
              type: integer
              format: int32
              minimum: 0
              maximum: 9
            timestampMs:
              type: integer
              format: int64
              minimum: 0
            planSize:
              type: integer
              format: int32
              enum: [4, 10]

    VideoSemanticStatus:
      type: object
      additionalProperties: false
      required: [libraryId, enabled, offline, activeGenerationId, coverage]
      properties:
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        enabled:
          type: boolean
        offline:
          type: boolean
        activeGenerationId:
          $ref: '#/components/schemas/NullableResourceID'
        coverage:
          oneOf:
            - $ref: '#/components/schemas/DerivedCoverage'
            - type: object
              nullable: true
              enum: [null]

    DerivedCoverage:
      type: object
      additionalProperties: false
      required: [eligible, completed, degraded, failed, stale, complete, revision]
      properties:
        eligible:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: integer
          format: int64
          minimum: 0
        degraded:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        stale:
          type: integer
          format: int64
          minimum: 0
        complete:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
        excludedLibraries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SemanticExcludedLibrary'

    FaceLibrarySettings:
      type: object
      additionalProperties: false
      required: [libraryId, enabled, state, revision, activeGenerationId, coverage]
      properties:
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        enabled:
          type: boolean
        state:
          type: string
          enum: [disabled, awaiting_model, building, ready, degraded, clearing]
        revision:
          type: integer
          format: int64
          minimum: 1
        activeGenerationId:
          $ref: '#/components/schemas/NullableResourceID'
        generationCurrent:
          type: boolean
          description: Whether this library's bound face generation matches the deployment's active generation, computed in the same read snapshot. Omitted when either generation is unavailable. False means coverage belongs to historical model results; a missing job will use the current model without deleting manual relationships.
        coverage:
          $ref: '#/components/schemas/DerivedCoverage'
        diagnostics:
          $ref: '#/components/schemas/FaceFailureDiagnostics'

    FaceFailureDiagnostics:
      type: object
      additionalProperties: false
      description: Current-generation, current-attempt bounded diagnostic summary; no raw exceptions or host paths. Legacy failures may lack details. New attempts replace previous attempt details.
      required: [latestTask, recordedFailures, unrecordedFailures, reasons, samples]
      properties:
        latestTask:
          type: object
          nullable: true
          additionalProperties: false
          required: [operationId, state, errorCode, updatedAt]
          properties:
            operationId:
              $ref: '#/components/schemas/ResourceID'
            state:
              type: string
              enum: [queued, running, cancelling, succeeded, failed, cancelled]
            errorCode:
              type: string
              nullable: true
              maxLength: 128
              description: Safe terminal task code; never a raw exception. library_scanning means bounded scan waiting expired.
            updatedAt:
              type: string
              format: date-time
        recordedFailures:
          type: integer
          format: int64
          minimum: 0
        unrecordedFailures:
          type: integer
          format: int64
          minimum: 0
          description: Historical coverage failures without persisted per-asset reasons; retry is needed to collect reasons.
        reasons:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [code, count]
            properties:
              code:
                $ref: '#/components/schemas/FaceAssetFailureCode'
              count:
                type: integer
                format: int64
                minimum: 1
        samples:
          type: array
          maxItems: 20
          description: At most 20 failed assets ordered by asset ID; a diagnostic sample, not a complete log listing.
          items:
            type: object
            additionalProperties: false
            required: [assetId, name, code, updatedAt]
            properties:
              assetId:
                $ref: '#/components/schemas/ResourceID'
              name:
                type: string
              sizeBytes:
                type: integer
                format: int64
                minimum: 0
                description: Current catalog source size. Zero with invalid_media identifies an empty original; absent on older servers.
              code:
                $ref: '#/components/schemas/FaceAssetFailureCode'
              updatedAt:
                type: string
                format: date-time

    FaceAssetFailureCode:
      type: string
      enum: [media_unreadable, invalid_media, inference_invalid_output, inference_timeout, analysis_failed]

    FaceLibrarySettingsUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean

    ClearFaceDataRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [clear_derived_face_data]

    ClearManualFaceRelationshipsRequest:
      type: object
      additionalProperties: false
      required: [confirmation, expectedPersonCount, expectedAssignmentCount, expectedConstraintCount]
      properties:
        confirmation:
          type: string
          enum: [clear_manual_face_relationships]
        expectedPersonCount:
          type: integer
          format: int64
          minimum: 0
        expectedAssignmentCount:
          type: integer
          format: int64
          minimum: 0
        expectedConstraintCount:
          type: integer
          format: int64
          minimum: 0

    PersonMergeCheck:
      type: object
      additionalProperties: false
      required: [sourcePersonId, targetPersonId, sourceRevision, targetRevision, canMerge, cannotLinkCount, duplicateAssignmentCount, sourceLimitExceeded, examples]
      properties:
        sourcePersonId:
          type: string
        targetPersonId:
          type: string
        sourceRevision:
          type: integer
          format: int64
          minimum: 1
        targetRevision:
          type: integer
          format: int64
          minimum: 1
        canMerge:
          type: boolean
          description: No known blocking constraints at this snapshot; POST must still recheck.
        cannotLinkCount:
          type: integer
          format: int64
          minimum: 0
          description: Exact number of face-anchor constraints, including detached or offline relationships.
        duplicateAssignmentCount:
          type: integer
          format: int64
          minimum: 0
        sourceLimitExceeded:
          type: boolean
          description: The source has more anchors than the existing atomic merge batch permits.
        examples:
          type: array
          maxItems: 3
          description: Distinct currently readable photo pairs for cannot-link constraints. May be empty even when blocked. Not a complete relationship list.
          items:
            type: object
            additionalProperties: false
            required: [sourceLibraryId, sourceAssetId, targetLibraryId, targetAssetId]
            properties:
              sourceLibraryId:
                type: string
              sourceAssetId:
                type: string
              targetLibraryId:
                type: string
              targetAssetId:
                type: string

    FaceClusterPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, coverage, groupAssignmentAllowed, counts]
      properties:
        counts:
          $ref: '#/components/schemas/FaceClusterCounts'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FaceCluster'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
        coverage:
          $ref: '#/components/schemas/DerivedCoverage'
        groupAssignmentAllowed:
          type: boolean
          description: True only after the frozen legal quality gate proves core precision at least 99.5%.

    FaceClusterCounts:
      type: object
      additionalProperties: false
      description: Exact counts for the selected library and kind in the same snapshot as items, before review filtering and pagination. Faces are not distinct photos.
      required: [totalGroups, pendingGroups, totalFaces, pendingFaces]
      properties:
        totalGroups:
          type: integer
          format: int64
          minimum: 0
        pendingGroups:
          type: integer
          format: int64
          minimum: 0
        totalFaces:
          type: integer
          format: int64
          minimum: 0
        pendingFaces:
          type: integer
          format: int64
          minimum: 0

    FaceCluster:
      type: object
      additionalProperties: false
      required: [id, libraryId, kind, memberCount, pendingMemberCount, previewAssetIds, revision]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        libraryId:
          $ref: '#/components/schemas/ResourceID'
        kind:
          type: string
          enum: [core, edge]
        memberCount:
          type: integer
          format: int64
          minimum: 1
        pendingMemberCount:
          type: integer
          format: int64
          minimum: 0
          description: Faces without a current manual person assignment or exclusion, at this read snapshot. memberCount remains the total face count.
        previewAssetIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceID'
        revision:
          type: integer
          format: int64
          minimum: 1

    FaceRegion:
      type: object
      additionalProperties: false
      description: Coarse display-only region rounded to integer percentages; not an exact detector box.
      required: [xPercent, yPercent, widthPercent, heightPercent]
      properties:
        xPercent:
          type: integer
          minimum: 0
          maximum: 100
        yPercent:
          type: integer
          minimum: 0
          maximum: 100
        widthPercent:
          type: integer
          minimum: 0
          maximum: 100
        heightPercent:
          type: integer
          minimum: 0
          maximum: 100

    AssetFace:
      type: object
      additionalProperties: false
      required: [faceId, assetId, ordinal, region, state, personId, revision]
      properties:
        cannotLinkFaceIds:
          type: array
          readOnly: true
          maxItems: 63
          uniqueItems: true
          description: Sorted opaque peer IDs among the same photo's current face projection only. New servers return an array, including empty; absence on an older server means unknown, not no constraint. No cross-photo IDs are exposed.
          items:
            $ref: '#/components/schemas/ResourceID'
        faceId:
          $ref: '#/components/schemas/ResourceID'
        assetId:
          $ref: '#/components/schemas/ResourceID'
        ordinal:
          type: integer
          minimum: 1
          maximum: 64
        region:
          $ref: '#/components/schemas/FaceRegion'
        state:
          type: string
          enum: [assigned, excluded, anonymous_core, anonymous_edge, unclustered]
        personId:
          $ref: '#/components/schemas/NullableResourceID'
        revision:
          type: integer
          format: int64
          minimum: 1

    AssetFacePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/AssetFace'

    FaceClusterMember:
      type: object
      additionalProperties: false
      required: [faceId, assetId, kind, region, revision]
      properties:
        faceId:
          $ref: '#/components/schemas/ResourceID'
        assetId:
          $ref: '#/components/schemas/ResourceID'
        kind:
          type: string
          enum: [core, edge]
        region:
          $ref: '#/components/schemas/FaceRegion'
        revision:
          type: integer
          format: int64
          minimum: 1

    FaceClusterDetailPage:
      type: object
      additionalProperties: false
      required: [cluster, items, nextCursor]
      properties:
        cluster:
          $ref: '#/components/schemas/FaceCluster'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FaceClusterMember'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    PersonPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Person'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    Person:
      type: object
      additionalProperties: false
      required: [id, name, confirmedFaceCount, assetCount, previewAssetId, revision, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC-normalized administrator-supplied name; duplicates are allowed.
        confirmedFaceCount:
          type: integer
          format: int64
          minimum: 0
        assetCount:
          type: integer
          format: int64
          minimum: 0
        previewAssetId:
          allOf:
            - $ref: '#/components/schemas/NullableResourceID'
          readOnly: true
          description: Latest modified confirmed photo in a ready library, using mtime then asset ID descending. Null when no currently available bound photo exists. Derived full-photo preview, never a writable person cover or face crop. Counts may include offline bound associations.
        revision:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    PersonAsset:
      type: object
      additionalProperties: false
      required: [asset, faceIds]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        faceIds:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceID'

    PersonAssetPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PersonAsset'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'

    CreatePersonRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sourceClusterId:
          $ref: '#/components/schemas/NullableResourceID'
        expectedClusterRevision:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    RenamePersonRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    FaceReviewRequest:
      oneOf:
        - $ref: '#/components/schemas/AssignFaceReview'
        - $ref: '#/components/schemas/AssignClusterReview'
        - $ref: '#/components/schemas/ExcludeFaceReview'
        - $ref: '#/components/schemas/CannotLinkFaceReview'
        - $ref: '#/components/schemas/MergePeopleReview'
        - $ref: '#/components/schemas/SplitFaceReview'
      discriminator:
        propertyName: action
        mapping:
          assign_face: '#/components/schemas/AssignFaceReview'
          assign_cluster: '#/components/schemas/AssignClusterReview'
          exclude_face: '#/components/schemas/ExcludeFaceReview'
          cannot_link: '#/components/schemas/CannotLinkFaceReview'
          merge_people: '#/components/schemas/MergePeopleReview'
          split_face: '#/components/schemas/SplitFaceReview'

    AssignFaceReview:
      type: object
      description: |
        Assign an unbound face, or atomically move a bound face when both
        sourcePersonId and expectedSourceRevision identify its current owner.
        The source fields must be supplied together. Omitting them never steals
        a bound assignment. A detached needs-review lineage may be reassigned;
        its previous owner revision is captured transactionally for guarded undo.
        Existing cannot-link constraints are preserved and block owner transfer.
      additionalProperties: false
      required: [action, faceId, personId, expectedFaceRevision, expectedPersonRevision]
      properties:
        action:
          type: string
          enum: [assign_face]
        sourcePersonId:
          $ref: '#/components/schemas/ResourceID'
        expectedSourceRevision:
          type: integer
          format: int64
          minimum: 1
        faceId:
          $ref: '#/components/schemas/ResourceID'
        personId:
          $ref: '#/components/schemas/ResourceID'
        expectedFaceRevision:
          type: integer
          format: int64
          minimum: 1
        expectedPersonRevision:
          type: integer
          format: int64
          minimum: 1

    AssignClusterReview:
      type: object
      additionalProperties: false
      required: [action, clusterId, personId, expectedClusterRevision, expectedPersonRevision]
      properties:
        action:
          type: string
          enum: [assign_cluster]
        clusterId:
          $ref: '#/components/schemas/ResourceID'
        personId:
          $ref: '#/components/schemas/ResourceID'
        expectedClusterRevision:
          type: integer
          format: int64
          minimum: 1
        expectedPersonRevision:
          type: integer
          format: int64
          minimum: 1

    ExcludeFaceReview:
      type: object
      additionalProperties: false
      required: [action, faceId, expectedFaceRevision]
      description: Exclude one face. The source fields must be supplied together. Omitted source guard asserts the face currently has no person assignment. Assigned faces require both exact source fields; mismatches return face_constraint_conflict without writes. Historical same-key replay remains idempotent.
      properties:
        sourcePersonId:
          $ref: '#/components/schemas/ResourceID'
        expectedSourceRevision:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [exclude_face]
        faceId:
          $ref: '#/components/schemas/ResourceID'
        expectedFaceRevision:
          type: integer
          format: int64
          minimum: 1

    CannotLinkFaceReview:
      type: object
      additionalProperties: false
      required: [action, leftFaceId, rightFaceId, expectedLeftRevision, expectedRightRevision]
      description: Mark two currently bound faces as belonging to different active people. All four person guard fields must be provided together for a new write and match left/source and right/target owners. An absent guard is accepted only for historical same-key replay; an unfenced new write conflicts without changes. Undo of a new action also checks the recorded person and anchor versions.
      properties:
        sourcePersonId:
          $ref: '#/components/schemas/ResourceID'
        targetPersonId:
          $ref: '#/components/schemas/ResourceID'
        expectedSourceRevision:
          type: integer
          format: int64
          minimum: 1
        expectedTargetRevision:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [cannot_link]
        leftFaceId:
          $ref: '#/components/schemas/ResourceID'
        rightFaceId:
          $ref: '#/components/schemas/ResourceID'
        expectedLeftRevision:
          type: integer
          format: int64
          minimum: 1
        expectedRightRevision:
          type: integer
          format: int64
          minimum: 1

    MergePeopleReview:
      type: object
      additionalProperties: false
      required: [action, sourcePersonId, targetPersonId, expectedSourceRevision, expectedTargetRevision, conflictsAcknowledged]
      properties:
        action:
          type: string
          enum: [merge_people]
        sourcePersonId:
          $ref: '#/components/schemas/ResourceID'
        targetPersonId:
          $ref: '#/components/schemas/ResourceID'
        expectedSourceRevision:
          type: integer
          format: int64
          minimum: 1
        expectedTargetRevision:
          type: integer
          format: int64
          minimum: 1
        conflictsAcknowledged:
          type: boolean

    SplitFaceReview:
      type: object
      additionalProperties: false
      required: [action, faceId, sourcePersonId, expectedFaceRevision, expectedSourceRevision]
      properties:
        action:
          type: string
          enum: [split_face]
        faceId:
          $ref: '#/components/schemas/ResourceID'
        sourcePersonId:
          $ref: '#/components/schemas/ResourceID'
        expectedFaceRevision:
          type: integer
          format: int64
          minimum: 1
        expectedSourceRevision:
          type: integer
          format: int64
          minimum: 1

    FaceReviewResult:
      type: object
      additionalProperties: false
      required: [reviewId, action, affectedPersonIds, revision, undoable]
      properties:
        reviewId:
          $ref: '#/components/schemas/ResourceID'
        action:
          type: string
          enum: [assign_face, assign_cluster, exclude_face, cannot_link, merge_people, split_face, undo]
        affectedPersonIds:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceID'
        revision:
          type: integer
          format: int64
          minimum: 1
        undoable:
          type: boolean

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      additionalProperties: false
      description: |
        Stable sanitized public error. It carries no arbitrary details object
        and is never a host or container path, SQL, stack trace, raw subprocess
        output, cookie, CSRF token, password, or secret.
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Localizable safe text. Clients must branch on code, never message.
        requestId:
          type: string
          pattern: '^req_[A-Za-z0-9_-]+$'
          maxLength: 128

    ErrorCode:
      type: string
      description: Stable machine-readable code. New public codes require a contract change.
      enum:
        - model_download_unavailable
        - model_download_active
        - invalid_request
        - validation_failed
        - invalid_cursor
        - invalid_credentials
        - setup_closed
        - setup_in_progress
        - authentication_required
        - session_expired
        - csrf_invalid
        - origin_invalid
        - forbidden
        - rate_limited
        - resource_not_found
        - library_not_found
        - directory_not_found
        - asset_not_found
        - tag_not_found
        - scan_not_found
        - removal_not_found
        - ai_operation_not_found
        - library_name_conflict
        - tag_name_conflict
        - library_path_overlap
        - library_root_unavailable
        - library_root_outside_allowed
        - library_root_symlink
        - library_root_mount_boundary
        - idempotency_conflict
        - precondition_required
        - precondition_failed
        - settings_invalid
        - scan_already_finished
        - ai_operation_already_finished
        - ai_disabled
        - model_candidate_stale
        - model_incompatible
        - model_source_unavailable
        - model_source_unsafe
        - model_unavailable
        - semantic_not_ready
        - semantic_cursor_stale
        - search_cursor_stale
        - semantic_busy
        - vocabulary_unavailable
        - suggestion_cursor_stale
        - storyboard_not_ready
        - video_semantic_not_ready
        - face_disabled
        - face_model_unavailable
        - face_not_ready
        - library_offline
        - face_cursor_stale
        - face_not_found
        - cluster_not_found
        - cluster_not_group_assignable
        - person_not_found
        - face_constraint_conflict
        - face_review_not_found
        - face_review_not_undoable
        - insufficient_space
        - source_offline
        - source_missing
        - source_unreadable
        - unsupported_media
        - invalid_media
        - thumbnail_failed
        - media_processing_timeout
        - invalid_range
        - range_not_satisfiable
        - service_not_ready
        - application_data_unavailable
        - internal_error
