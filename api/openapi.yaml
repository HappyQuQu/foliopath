  /api/v1/scans/{scanId}/cancel:
    post:
      tags: [Scans]
      operationId: cancelScan
      summary: Request cooperative scan cancellation
      description: |
        Cancellation is idempotent and cooperative. It preserves the last
        reliable index and safely committed additions. For a queued run it
        atomically reaches `cancelled`; for a running run it records
        `cancelRequestedAt`, advances the validator, and returns immediately.
        The worker observes the request at bounded batch/checkpoint boundaries
        and never performs stale-generation cleanup. Repeating cancellation
        while it is pending returns the same logical result. A terminal scan
        fails with `scan_already_finished`.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-SCN-004, FR-SCN-008, NFR-REL-001]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '404': [scan_not_found]
        '409': [scan_already_finished]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/ScanIDParameter'
      responses:
        '202':
          description: Cancellation requested or already requested.
          headers:
            Location:
              description: Relative URL of the scan.
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/libraries/{libraryId}/directories:
    get:
      tags: [Catalog]
      operationId: listDirectories
      summary: List direct child directories from the reliable index
      description: |
        Omit `parentId` for the logical library root. Supplying that library's
        indexed root-directory ID is equivalent and is normalized to the same
        cursor scope. Every direct child in the preserved index is returned,
        including directories with no supported media. A parent from another
        library is indistinguishable from a missing directory and returns
        `directory_not_found`.

        Optional `q` filters every direct child in the reliable index, not just
        the current page. The server trims outer Unicode whitespace, applies
        Unicode NFKC plus full case folding, splits on Unicode whitespace,
        removes duplicate terms, and requires every term to occur as a literal
        substring of the normalized direct-child name. Diacritics are
        preserved; one- and two-character terms are valid; punctuation and
        FTS syntax have no operator meaning.

        Results use `(naturalNameKey ASC, name ASC, id ASC)` keyset order.
        Cursors bind the library, normalized parent, normalized query terms,
        search profile, ordering version, and reliable catalog generation.
        Changing or clearing `q`, or advancing the reliable generation, makes
        an old cursor fail with `invalid_cursor`. An offline library still
        returns its preserved index with `200`; pending/scanning/offline state
        is read from the Library resource, so an empty page alone is never
        proof that the filesystem is empty. The request never traverses the
        filesystem.
      x-requirements: [FR-BRW-001, FR-BRW-005, FR-BRW-008, FR-BRW-009, FR-BRW-010]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '404': [library_not_found, directory_not_found]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/LibraryIDParameter'
        - $ref: '#/components/parameters/ParentDirectoryIDParameter'
        - $ref: '#/components/parameters/DirectorySearchQueryParameter'
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: Direct children in natural-name ascending order with stable ID tie-breaker.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/directories/{directoryId}:
    get:
      tags: [Catalog]
      operationId: getDirectory
      summary: Get an indexed directory and safe breadcrumbs
      description: |
        The indexed root directory is a valid resource: its public `name` is
        the current media-library display name, `relativePath` is empty, and
        `parentId` is null. `breadcrumbs` is ordered root-to-current and always
        includes both endpoints, so the root detail contains exactly one item.
        Breadcrumbs expose only IDs, display names, and library-relative paths.
        Offline libraries return preserved indexed detail with `200`; this
        operation never checks or traverses the filesystem.
      x-requirements: [FR-BRW-001, FR-BRW-003, FR-BRW-008, NFR-PRIV-001]
      x-error-codes:
        '401': [authentication_required, session_expired]
