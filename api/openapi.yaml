openapi: 3.0.3
info:
  title: FolioPath HTTP API
  version: 0.1.0
  description: |
    Authoritative HTTP contract for the FolioPath MVP-2026-07-23 scope,
    revision 1.

    All business endpoints use an authenticated same-origin browser session.
    State-changing authenticated operations additionally require the
    session-bound `X-CSRF-Token`. First-run setup and login do not yet have a
    session, so they require a validated same-origin `Origin` header.

    IDs and cursors are opaque. Media content endpoints accept only resource
    IDs, never filesystem paths. Management responses may expose a library
    root relative to the allowed `/library` container mount and a server-built
    `/library/...` display label; no response may expose a host path.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
x-foliopath-contract:
  status: authoritative
  targetVersion: MVP-2026-07-23
  scopeRevision: 1
  baselineEvent: BASELINE-2026-07-23
x-foliopath-search-profile:
  version: 1
  fields: [name, libraryRelativePath]
  normalization: Unicode NFKC plus full case folding
  termSplit: Unicode whitespace
  termCombination: all
  termMatch: literal substring
  diacriticFolding: false
  dateField: file modification time
  dateInterval: modifiedFrom inclusive, modifiedBefore exclusive
  relevanceSort: false
servers:
  - url: /
    description: Same-origin FolioPath server
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Unauthenticated process and dependency readiness without sensitive details.
  - name: Authentication
    description: First-run administrator setup and revocable browser sessions.
  - name: System
    description: Authenticated runtime capability and initialization state.
  - name: Settings
    description: Schema-bound administrator settings with optimistic concurrency.
  - name: Library paths
    description: Restricted browsing of selectable directories below the allowed media root.
  - name: Libraries
    description: Media-library configuration, status, and safe removal.
  - name: Scans
    description: Restart-safe full reconciliation scans and cooperative cancellation.
  - name: Catalog
    description: Bounded indexed directory browsing and media search.
  - name: Media
    description: Indexed media metadata, thumbnails, and read-only original content.
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the process is alive
      description: |
        Process-level liveness only. It does not disclose configuration,
        database paths, media paths, account details, or dependency errors.
      security: []
      x-requirements: [FR-DEP-004, NFR-OPS-001, NFR-PRIV-001]
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              example:
                status: live
                reasonCode: null

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the HTTP service can accept application traffic
      description: |
        Readiness depends on writable application data and successful
        migrations. An unavailable media mount is reported as degraded by the
        authenticated system status and does not reveal a filesystem path here.
      security: []
      x-requirements: [FR-DEP-004, NFR-OPS-001, NFR-PRIV-001]
      responses:
        '200':
          description: The service can accept application traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                reasonCode: null
        '503':
          description: The service is not ready. The reason code is safe for logs and orchestration.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'
              example:
                status: not_ready
                reasonCode: application_data_unavailable

  /api/v1/auth/status:
    get:
      tags: [Authentication]
      operationId: getAuthenticationStatus
      summary: Get first-run authentication status
      description: |
        Returns only whether the one-time administrator setup is still
        available. It never returns a username or any other account detail.
      security: []
      x-requirements: [FR-AUTH-001, FR-AUTH-002, NFR-SEC-002, NFR-PRIV-001]
      x-error-codes:
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Authentication status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/auth/setup:
    post:
      tags: [Authentication]
      operationId: setupAdministrator
      summary: Atomically create the only administrator
      description: |
        Available only while `setupRequired` is true. Concurrent setup
        attempts can create at most one account. A successful response creates
        a server-side session, sets the session cookie, and returns the
        session-bound CSRF token. Later calls fail with `setup_closed`.
      security: []
      x-requirements: [FR-AUTH-001, FR-AUTH-002, FR-AUTH-004, NFR-SEC-002]
      x-error-codes:
        '400': [invalid_request]
        '403': [origin_invalid]
        '409': [setup_closed, setup_in_progress]
        '422': [validation_failed]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Administrator and session created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an administrator session
      description: |
        Uses one generic `invalid_credentials` failure for an unknown account
        and an incorrect password. A successful response sets the session
        cookie and returns a session-bound CSRF token.
      security: []
      x-requirements: [FR-AUTH-001, FR-AUTH-004, NFR-SEC-002, NFR-PRIV-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [invalid_credentials]
        '403': [origin_invalid]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Get the current administrator session
      description: Returns a safe administrator summary and a current CSRF token.
      x-requirements: [FR-AUTH-001, FR-AUTH-004, NFR-SEC-002]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Current session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: Revokes the server-side session and expires the browser cookie.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-AUTH-001, FR-AUTH-004, NFR-SEC-002]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '204':
          description: Session revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/ExpiredSessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Get safe application status and capability flags
      description: |
        Requires an authenticated session. Values are safe for the application
        shell and never include database, cache, container-internal, or host paths.
      x-requirements: [FR-DEP-004, FR-AUTH-002, NFR-OPS-001, NFR-PRIV-001]
      responses:
        '200':
          description: Application status.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get administrator-configurable application settings
      x-requirements: [FR-DEP-003, FR-SCN-007, FR-SCN-013, FR-MED-008, FR-UI-006]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Current settings. The ETag is required for a later update.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Update known application settings
      description: |
        Only fields declared by `SettingsUpdate` are accepted. A null scheduled
        scan interval disables scheduled full scans; manual scans remain enabled.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-DEP-003, FR-SCN-007, FR-SCN-013, FR-MED-008, FR-UI-006]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '412': [precondition_failed]
        '422': [settings_invalid]
        '428': [precondition_required]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Updated settings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/library-paths:
    get:
      tags: [Library paths]
      operationId: listLibraryPaths
      summary: List approved direct child directories below the allowed media root
      description: |
        `parent` is relative to `/library`; omit it or pass the empty string for
        `/library` itself. The server rejects absolute paths, dot segments,
        encoded traversal, NUL bytes, unsupported separators, and symlink
        escapes. It does not follow directory symlinks. Results never include
        files or host paths, and creation repeats all safety and overlap checks.
      x-requirements: [FR-LIB-001, FR-LIB-002, FR-LIB-004, NFR-SEC-001, NFR-PRIV-001]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '409': [library_root_unavailable, library_root_outside_allowed, library_root_symlink, library_root_mount_boundary]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/LibraryParentPathParameter'
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: A naturally sorted page of direct child directories.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryPathPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/catalog/state:
    get:
      tags: [Catalog]
      operationId: getCatalogState
      summary: Get the lightweight catalog content revision
      description: |
        Returns a monotonic notification revision for authenticated clients.
        It advances after a reliable full generation is published and after
        each committed automatic-discovery reconciliation batch. It is not a
        browse/search cursor revision and does not authorize filesystem
        access. A matching If-None-Match returns 304 without a body.
      x-requirements: [FR-SCN-014, NFR-PERF-003, NFR-PRIV-001]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatchHeader'
      responses:
        '200':
          description: Current catalog content revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogState'
        '304':
          description: Catalog content has not changed for the supplied validator.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/libraries:
    get:
      tags: [Libraries]
      operationId: listLibraries
      summary: List configured media libraries
      description: Libraries are naturally sorted by their unique display name and stable ID.
      x-requirements: [FR-LIB-001, FR-LIB-006, FR-LIB-008, FR-SCN-013, FR-SCN-014]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: A stable page of media libraries.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Libraries]
      operationId: createLibrary
      summary: Create a media library and queue its first full scan
      description: |
        `rootPath` is relative to `/library`; the empty string selects
        `/library` itself and therefore conflicts with every other possible
        library. Name uniqueness, root readability, path containment, symlink
        safety, and ancestor/descendant overlap are rechecked atomically.

        An idempotency key is retained for at least 24 hours. Reusing the same
        key and identical body returns the original logical result and never
        creates a duplicate. If that result has since been removed, replay
        fails with `idempotency_conflict` until retention expires.
        Reusing a key with a different body fails with
        `idempotency_conflict`. The library row, its `library_created` queued
        full scan, and the idempotency record commit in one short transaction
        before a worker is notified.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-LIB-001, FR-LIB-002, FR-LIB-003, FR-LIB-004, FR-LIB-008, FR-SCN-001, NFR-SAFE-001, NFR-SEC-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '409': [library_name_conflict, library_path_overlap, library_root_unavailable, library_root_outside_allowed, library_root_symlink, library_root_mount_boundary, idempotency_conflict]
        '422': [validation_failed]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryRequest'
      responses:
        '201':
          description: Library created and its first scan queued. Idempotent replay returns this same representation.
          headers:
            Location:
              description: Relative URL of the created library.
              schema:
                type: string
                example: /api/v1/libraries/lib_01JZ8Y7QVK
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLibraryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/LibraryIDParameter'
    get:
      tags: [Libraries]
      operationId: getLibrary
      summary: Get a media library and its latest scan summary
      x-requirements: [FR-LIB-001, FR-LIB-005, FR-LIB-006, FR-SCN-003, FR-SCN-013, FR-SCN-014]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '404': [library_not_found]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Media library. The ETag is required for rename or removal.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Libraries]
      operationId: renameLibrary
      summary: Rename a media library
      description: |
        The MVP request schema intentionally has no root path field. Changing a
        root requires removing and recreating the library. A strong ETag
        changes whenever any represented library field changes. Renaming to
        the current normalized name is a no-op and returns the current
        representation without advancing the validator.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-LIB-008]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '404': [library_not_found]
        '409': [library_name_conflict, idempotency_conflict]
        '412': [precondition_failed]
        '422': [validation_failed]
        '428': [precondition_required]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameLibraryRequest'
      responses:
        '200':
          description: Renamed media library.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Libraries]
      operationId: removeLibrary
      summary: Remove a media library from FolioPath
      description: |
        Accepts an asynchronous, restart-safe cleanup of configuration, index,
        jobs, and derived cache only. It never moves, edits, or deletes original
        media. The library remains identifiable until cleanup succeeds; poll
        the returned removal resource.

        Acceptance atomically creates the durable removal, prevents new scans,
        and requests cooperative cancellation of a queued or running scan.
        Cleanup waits for that scan to reach a safe terminal point, deletes
        database/cache state in bounded idempotent steps, and never opens an
        original-media deletion capability. An identical idempotency replay
        returns the same removal. A different key while a removal is active
        fails with `idempotency_conflict`.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-LIB-007, NFR-SAFE-001, MVP-AC-008]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '404': [library_not_found]
        '409': [idempotency_conflict]
        '412': [precondition_failed]
        '428': [precondition_required]
        '429': [rate_limited]
