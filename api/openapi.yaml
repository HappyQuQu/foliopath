openapi: 3.0.3
info:
  title: FolioPath HTTP API
  version: 0.1.0
  description: |
    Authoritative HTTP contract through the FolioPath POST-MVP-5 scope,
    revision 2. Revision-1 image semantic operations are contract-frozen.
    Revision-2 controlled tag suggestions, video semantic search, and local
    anonymous face/person curation remain gated from production composition
    until INT-S1R2 is accepted.

    All business endpoints use an authenticated same-origin browser session.
    State-changing authenticated operations additionally require the
    session-bound `X-CSRF-Token`. First-run setup and login do not yet have a
    session, so they require a validated same-origin `Origin` header.

    IDs and cursors are opaque. Media content endpoints accept only resource
    IDs, never filesystem paths. Management responses may expose a library
    root relative to the allowed `/library` container mount and a server-built
    `/library/...` display label; no response may expose a host path.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
x-foliopath-contract:
  status: authoritative
  targetVersion: POST-MVP-5
  scopeRevision: 2
  baselineEvent: CR-2026-021
  additiveChanges: [CR-2026-026, CR-2026-031, CR-2026-035, CR-2026-050, CR-2026-051, CR-2026-058]
x-foliopath-search-profile:
  version: 1
  fields: [name, libraryRelativePath]
  normalization: Unicode NFKC plus full case folding
  termSplit: Unicode whitespace
  termCombination: all
  termMatch: literal substring
  diacriticFolding: false
  dateField: file modification time
  dateInterval: modifiedFrom inclusive, modifiedBefore exclusive
  relevanceSort: false
servers:
  - url: /
    description: Same-origin FolioPath server
security:
  - cookieAuth: []
tags:
  - name: Deletion
    description: Explicitly authorized original-file deletion, recovery and durable progress.
  - name: OCR
    description: Explicitly configured, per-library OCR administration; no plaintext or search.
  - name: Health
    description: Unauthenticated process and dependency readiness without sensitive details.
  - name: Authentication
    description: First-run administrator setup and revocable browser sessions.
  - name: Account
    description: The authenticated single administrator's profile and password.
  - name: System
    description: Authenticated runtime capability and initialization state.
  - name: Settings
    description: Schema-bound administrator settings with optimistic concurrency.
  - name: Cache
    description: Safe thumbnail-cache usage and singleton derived-cache cleanup.
  - name: Library paths
    description: Restricted browsing of selectable directories below the allowed media root.
  - name: Libraries
    description: Media-library configuration, status, and safe removal.
  - name: Scans
    description: Restart-safe full reconciliation scans and cooperative cancellation.
  - name: Catalog
    description: Bounded indexed directory browsing and media search.
  - name: Media
    description: Indexed media metadata, thumbnails, and read-only original content.
  - name: Curation
    description: Application-only favorites and manual tags that never modify original media.
  - name: Automatic tags
    description: Per-library automatic image tags with manual priority and persistent removal suppression.
  - name: AI models
    description: Deployment-approved model downloads, offline discovery, installation, availability, and activation.
  - name: Semantic search
    description: Opt-in local image and complete-storyboard video semantic indexing and natural-language search.
  - name: Tag suggestions
    description: Controlled-vocabulary local suggestions with explicit administrator review.
  - name: People
    description: Opt-in local anonymous face clustering and administrator-owned person curation.
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the process is alive
      description: |
        Process-level liveness only. It does not disclose configuration,
        database paths, media paths, account details, or dependency errors.
      security: []
      x-requirements: [FR-DEP-004, NFR-OPS-001, NFR-PRIV-001]
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              example:
                status: live
                reasonCode: null

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the HTTP service can accept application traffic
      description: |
        Readiness depends on writable application data and successful
        migrations. An unavailable media mount is reported as degraded by the
        authenticated system status and does not reveal a filesystem path here.
      security: []
      x-requirements: [FR-DEP-004, NFR-OPS-001, NFR-PRIV-001]
      responses:
        '200':
          description: The service can accept application traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                reasonCode: null
        '503':
          description: The service is not ready. The reason code is safe for logs and orchestration.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'
              example:
                status: not_ready
                reasonCode: application_data_unavailable

  /api/v1/auth/status:
    get:
      tags: [Authentication]
      operationId: getAuthenticationStatus
      summary: Get first-run authentication status
      description: |
        Returns only whether the one-time administrator setup is still
        available. It never returns a username or any other account detail.
      security: []
      x-requirements: [FR-AUTH-001, FR-AUTH-002, NFR-SEC-002, NFR-PRIV-001]
      x-error-codes:
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Authentication status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/auth/setup:
    post:
      tags: [Authentication]
      operationId: setupAdministrator
      summary: Atomically create the only administrator
      description: |
        Available only while `setupRequired` is true. Concurrent setup
        attempts can create at most one account. A successful response creates
        a server-side session, sets the session cookie, and returns the
        session-bound CSRF token. Later calls fail with `setup_closed`.
      security: []
      x-requirements: [FR-AUTH-001, FR-AUTH-002, FR-AUTH-004, NFR-SEC-002]
      x-error-codes:
        '400': [invalid_request]
        '403': [origin_invalid]
        '409': [setup_closed, setup_in_progress]
        '422': [validation_failed]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Administrator and session created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an administrator session
      description: |
        Uses one generic `invalid_credentials` failure for an unknown account
        and an incorrect password. A successful response sets the session
        cookie and returns a session-bound CSRF token.
      security: []
      x-requirements: [FR-AUTH-001, FR-AUTH-004, NFR-SEC-002, NFR-PRIV-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [invalid_credentials]
        '403': [origin_invalid]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Get the current administrator session
      description: Returns a safe administrator summary and a current CSRF token.
      x-requirements: [FR-AUTH-001, FR-AUTH-004, NFR-SEC-002]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Current session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: Revokes the server-side session and expires the browser cookie.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-AUTH-001, FR-AUTH-004, NFR-SEC-002]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '204':
          description: Session revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/ExpiredSessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: Get the current administrator account
      description: |
        Returns the only administrator's safe profile. The strong ETag binds
        the account revision and is required by profile and password updates.
        Username is immutable after first-run setup.
      x-requirements: [FR-AUTH-005, FR-UI-009, NFR-SEC-002, NFR-PRIV-001]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Current administrator profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Account]
      operationId: updateAccount
      summary: Update the administrator display name
      description: |
        Updates only the display name in one short transaction. The username
        and authentication identity are immutable. A no-op request succeeds
        without changing the revision. A concurrent account change makes the
        supplied ETag fail closed.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-AUTH-005, FR-UI-009, NFR-SEC-002, NFR-PRIV-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '412': [precondition_failed]
        '422': [validation_failed]
        '428': [precondition_required]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Updated administrator profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/account/password:
    post:
      tags: [Account]
      operationId: changeAccountPassword
      summary: Change the administrator password
      description: |
        Verifies the current password and validates the new password before
        changing durable state. On success one transaction stores the new
        verifier, advances account and authentication revisions, preserves
        this authenticated session at the new authentication revision, and
        revokes every other session. Any failure leaves the verifier and all
        sessions unchanged. The confirmation password is a client-only check
        and is never sent.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-AUTH-005, FR-AUTH-004, NFR-SEC-002, NFR-PRIV-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired, invalid_credentials]
        '403': [csrf_invalid]
        '412': [precondition_failed]
        '422': [validation_failed]
        '428': [precondition_required]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; current session preserved and all other sessions revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Get safe application status and capability flags
      description: |
        Requires an authenticated session. Values are safe for the application
        shell and never include database, cache, container-internal, or host paths.
      x-requirements: [FR-DEP-004, FR-AUTH-002, NFR-OPS-001, NFR-PRIV-001]
      responses:
        '200':
          description: Application status.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get administrator-configurable application settings
      x-requirements: [FR-DEP-003, FR-SCN-007, FR-SCN-013, FR-MED-008, FR-UI-006]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Current settings. The ETag is required for a later update.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Update known application settings
      description: |
        Only fields declared by `SettingsUpdate` are accepted. A null scheduled
        scan interval disables scheduled full scans; manual scans remain enabled.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-DEP-003, FR-SCN-007, FR-SCN-013, FR-MED-008, FR-UI-006]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '412': [precondition_failed]
        '422': [settings_invalid]
        '428': [precondition_required]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Updated settings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cache:
    get:
      tags: [Cache]
      operationId: getCacheSummary
      summary: Get safe derived-cache usage and pressure
      description: |
        Returns aggregate thumbnail and poster cache state only. It never
        returns cache filenames, cache paths, asset paths, database paths, or
        original-media paths. `availableBytes` describes the writable
        application-data filesystem without identifying it.
      x-requirements: [FR-MED-008, FR-UI-009, NFR-OPS-001, NFR-PRIV-001]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Current cache summary and singleton cleanup state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cache/cleanup:
    get:
      tags: [Cache]
      operationId: getCacheCleanup
      summary: Get the singleton cache-cleanup state
      description: |
        Returns `idle` before any request and the latest durable singleton
        cleanup thereafter. It is an operational status resource, not a task
        history or per-asset queue.
      x-requirements: [FR-MED-008, FR-UI-009, NFR-OPS-001, NFR-PRIV-001]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: Current or latest singleton cleanup state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheCleanup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Cache]
      operationId: startCacheCleanup
      summary: Remove all reconstructible thumbnails and posters
      description: |
        Starts a bounded durable cleanup that removes derived cache files only;
        it never changes settings, the reliable catalog, or original media.
        The worker deletes each cache file before removing its ready database
        state, works in bounded LRU batches, and preserves the configured safe
        free-space margin for SQLite and temporary writes.

        At most one singleton cleanup is queued or running. A different
        idempotency key while active coalesces onto the same cleanup and
        returns `200`; replaying a completed key returns its recorded
        representation. Restart resumes queued/running work, and failure
        remains retryable by a later request. This operation does not enqueue
        replacement thumbnails, provide cancellation, create history, or
        expose per-asset tasks.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-MED-008, FR-UI-009, NFR-SAFE-001, NFR-OPS-001]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '409': [idempotency_conflict]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Existing active cleanup or completed idempotency replay.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Location:
              description: Fixed relative URL `/api/v1/cache/cleanup`.
              schema:
                type: string
                enum: [/api/v1/cache/cleanup]
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheCleanup'
        '202':
          description: New singleton cleanup accepted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Location:
              description: Fixed relative URL `/api/v1/cache/cleanup`.
              schema:
                type: string
                enum: [/api/v1/cache/cleanup]
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheCleanup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/library-paths:
    get:
      tags: [Library paths]
      operationId: listLibraryPaths
      summary: List approved direct child directories below the allowed media root
      description: |
