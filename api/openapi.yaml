          description: An existing queued or running scan was returned.
          headers:
            Location:
              description: Relative URL of the existing scan.
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
