        '404': [library_not_found]
        '409': [face_disabled, face_model_unavailable, face_not_ready, library_offline, idempotency_conflict]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticJobRequest'
