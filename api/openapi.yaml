  /api/v1/search/assets:
    get:
      tags: [Semantic search]
      operationId: searchAssetsWithSources
      summary: Fuse filename, parent path and image semantic matches with actual evidence
      description: |
        ADR-0031 relevance v1. All literal terms must occur in the filename and/or
        parent library-relative directory. A filename is not also a parent-path hit.
        Current image vectors with cosine >=0.20 contribute semantic evidence;
        this is a retrieval cutoff, not calibrated confidence. Dual-source hits
        precede literal-only then semantic-only, with cosine DESC and asset ID ASC
        within each tier. Each asset occurs once. Video semantic frames remain on
        the existing semantic/videos endpoint; videos here can match literal fields.
        OCR uses source-bound current enabled-library plaintext, with bounded original line excerpts. OCR-only never calls the semantic encoder. All-mode explicitly degrades to literal/OCR search if
        semantics is disabled or unavailable. Semantic-only reports unavailability.
        The authenticated cursor binds query hash, filters, catalog/semantic snapshot,
        query vector hash and ordering tuple. Snapshot changes require a refresh.
      x-requirements: [FR-SEARCH-001, FR-SEARCH-002, FR-SEARCH-003, FR-INT-003]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '409': [search_cursor_stale, ai_disabled, semantic_not_ready]
        '429': [rate_limited, semantic_busy]
        '503': [model_unavailable]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/RequiredSearchQueryParameter'
        - $ref: '#/components/parameters/OptionalLibraryIDParameter'
        - $ref: '#/components/parameters/DirectoryFilterParameter'
        - $ref: '#/components/parameters/RecursiveParameter'
        - $ref: '#/components/parameters/KindFilterParameter'
        - $ref: '#/components/parameters/ModifiedFromParameter'
        - $ref: '#/components/parameters/ModifiedBeforeParameter'
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
        - name: mode
          in: query
          schema:
            type: string
            enum: [all, filename, semantic, ocr]
            default: all
      responses:
        '200':
          description: Deduplicated relevance page, actual match sources and semantic availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusedSearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/semantic/assets:
    get:
      tags: [Semantic search]
      operationId: searchAssetsBySemantics
      summary: Search indexed images by Chinese or English visual description
      description: |
        Omit `libraryId` for all enabled libraries. `directoryId` requires a
        library and selects direct children unless `recursive=true`. Results
        use `score DESC, asset_id ASC`; the score is not exposed as a percent.
        The cursor binds normalized query fingerprint, scope, catalog revision,
        model generation, semantic generation, progress revision, and the last
        ordering tuple. Query text is never logged or placed in the cursor.
      x-requirements: [FR-INT-002, FR-INT-003, FR-INT-005, FR-INT-016, NFR-INT-001, NFR-INT-004, NFR-INT-005]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '409': [ai_disabled, semantic_not_ready, semantic_cursor_stale]
        '429': [rate_limited, semantic_busy]
        '503': [model_unavailable]
        '500': [internal_error]
      parameters:
