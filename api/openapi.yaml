          description: Directory detail. All paths are relative to its media-library root.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/libraries/{libraryId}/assets:
    get:
      tags: [Catalog]
      operationId: listLibraryAssets
      summary: Browse or search media within a media library
      description: |
        Omit `directoryId` to use the logical library root. Supplying that
        library's indexed root-directory ID is equivalent and is normalized to
        the same cursor scope. A directory from another library is
        indistinguishable from a missing directory and returns
        `directory_not_found`.

        With no `q`, `recursive=false` returns only assets whose parent is the
        selected directory. `recursive=true` includes the selected directory
        and all indexed descendants; at the root it includes the whole library.

        With `q`, no `directoryId`, and no `recursive` parameter, the scope is
        the entire current library. Supplying `recursive=false` explicitly
        selects only direct assets at the logical library root; supplying
        `recursive=true` selects the root and all descendants. With both `q`
        and `directoryId`, the scope is that current directory; omitted/false
        `recursive` searches direct assets and true includes descendants. This
        explicit recursive parameter lets the browse UI distinguish a filtered
        root directory from the distinct whole-library search scope. Every item
        retains its source `directoryId` and library-relative path.

        Search input is plain text, never FTS syntax. The server trims outer
        Unicode whitespace, applies Unicode NFKC and full case folding, splits
        on Unicode whitespace, removes duplicate terms, and requires every
        term to occur as a literal substring in either the normalized filename
        or normalized library-relative path. Diacritics are preserved. Quotes,
        percent signs, underscores, dashes, dots, and path separators have no
        operator meaning. One- and two-character terms remain valid.

        `kind` and the half-open modification-time interval
        `[modifiedFrom, modifiedBefore)` filter the selected scope. Bounds are
        UTC RFC 3339 instants and `modifiedFrom` must precede
        `modifiedBefore` when both are present. The date field is filesystem
        modification time, never EXIF or container creation time.

        With no search and `recursive=false`, the default order is natural name
        ascending. Recursive or searched results default to file modification
        time descending. Name order groups media by source folder before
        applying natural filename order. Within one library its tuple is
        `(directoryPath, naturalNameKey, name, relativePath, id)`; modified-time order uses
        `(modifiedAt, id)`; size order uses `(sizeBytes, id)`, with every tuple
        component following the requested direction. No relevance sort exists.
        Cursors bind the
        library, canonical scope, effective recursive mode, normalized terms,
        kinds, time bounds, effective sort/order, ordering/profile versions,
        and reliable catalog generation. Any bound-value or generation change
        makes an old cursor fail with `invalid_cursor`; it never falls back to
        page one.

        Offline libraries return preserved indexed assets with `200` and mark
        their source availability. Pending/scanning/offline state comes from
        the Library resource, so an empty page is not by itself a final empty
        state. The request never traverses the filesystem.
      x-requirements: [FR-BRW-002, FR-BRW-003, FR-BRW-005, FR-BRW-009, FR-SRH-001, FR-SRH-002, FR-SRH-004]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '404': [library_not_found, directory_not_found]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/LibraryIDParameter'
        - $ref: '#/components/parameters/DirectoryFilterParameter'
        - $ref: '#/components/parameters/RecursiveParameter'
        - $ref: '#/components/parameters/SearchQueryParameter'
        - $ref: '#/components/parameters/KindFilterParameter'
        - $ref: '#/components/parameters/ModifiedFromParameter'
        - $ref: '#/components/parameters/ModifiedBeforeParameter'
        - $ref: '#/components/parameters/SortParameter'
        - $ref: '#/components/parameters/OrderParameter'
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: Stable indexed media page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assets:
    get:
      tags: [Catalog]
      operationId: searchAssets
      summary: Search indexed media across all libraries
      description: |
        Searches all configured libraries. This is the only all-library search
        operation; current-library and current-directory scopes use the
        library-scoped operation.

        Matching uses the same versioned plain-text profile as library search:
        outer Unicode whitespace is trimmed, Unicode NFKC plus full case
        folding is applied, Unicode-whitespace terms are combined with AND,
        and each term is a literal substring of normalized filename or
        library-relative path. The query is never interpreted as FTS syntax,
        diacritics are preserved, and one- or two-character terms are valid.

        `kind` and `[modifiedFrom, modifiedBefore)` use the same filtering
        semantics as library search. Results default to file modification time
        descending and include a safe media-library name and relative path.
        Explicit name ordering groups results by library and source folder,
        then applies natural filename order using
        `(libraryId, directoryPath, naturalNameKey, name, relativePath, id)`; modification-time
        ordering uses `(modifiedAt, id)` and size ordering uses
        `(sizeBytes, id)`. No relevance order is provided.

        A global cursor binds every normalized query field plus one persisted
        global catalog revision. That revision advances when a library is
        created/removed or a reliable full-scan generation is published.
        A mismatch returns `invalid_cursor`; the server never embeds an
        unbounded per-library generation vector. Safely committed additions
        during an unfinished scan may become visible to later keyset pages,
        matching library browse semantics. Offline libraries contribute their
        preserved indexed results and each item reports source availability.
        The request never traverses the filesystem.
      x-requirements: [FR-SRH-001, FR-SRH-002, FR-SRH-003, FR-SRH-004]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/RequiredSearchQueryParameter'
        - $ref: '#/components/parameters/KindFilterParameter'
        - $ref: '#/components/parameters/ModifiedFromParameter'
        - $ref: '#/components/parameters/ModifiedBeforeParameter'
        - $ref: '#/components/parameters/SortParameter'
        - $ref: '#/components/parameters/OrderParameter'
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: Stable cross-library search page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

