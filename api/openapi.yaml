          description: Current aggregate derived-media processing state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaProcessingProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/libraries/{libraryId}/media-processing/repair:
    parameters:
      - $ref: '#/components/parameters/LibraryIDParameter'
    post:
      tags: [Media]
      operationId: repairLibraryMediaProcessing
      summary: Requeue missing or all derived media
      description: |
        With `mode=missing`, requeues grid and storyboard jobs whose ready derived
        file is missing or whose previous processing attempt failed. With
        `mode=all`, requeues every completed or failed grid and storyboard job.
        Terminal failure codes prevent automatic retry loops but never block an
        administrator-triggered action. Admission uses bounded database batches,
        active work is never duplicated, and original media is never modified.
      x-requirements: [FR-OPS-007, NFR-OPS-003]
      parameters:
        - name: mode
          in: query
          required: false
          description: Missing/failed results by default, or every completed/failed result.
          schema:
            type: string
            enum: [missing, all]
            default: missing
      x-error-codes:
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '404': [library_not_found]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '202':
          description: All matching jobs were admitted through bounded batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFailureRetrySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

