  /api/v1/assets/{assetId}/exif:
    get:
      tags: [Media]
      operationId: getAssetExif
      summary: Read bounded shooting information from the current original
      description: |
        Authenticated on-demand read through the content boundary. Only eight
        allowlisted photographic fields are returned, as bounded plain text.
        Missing tags and non-image assets return an empty fields array. No GPS,
        serial numbers, raw metadata, file paths or HTML are returned. Reading
        never modifies originals, the catalog, jobs, thumbnails or AI results.
        The current source is checked before and after extraction. The request
        shares content admission and native image memory admission and has a
        ten-second deadline. Responses are not cached by HTTP intermediaries.
      x-requirements: [FR-EXIF-001, FR-EXIF-002, FR-EXIF-003, NFR-SAFE-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '404': [asset_not_found]
        '409': [source_offline, source_missing, source_unreadable]
        '422': [invalid_media, unsupported_media, media_processing_timeout]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/AssetIDParameter'
      responses:
        '200':
          description: Current source-bound shooting fields, or an empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetExif'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assets/{assetId}/thumbnail:
    get:
      tags: [Media]
      operationId: getAssetThumbnail
      summary: Get a generated thumbnail or its bounded pending state
      description: |
        A ready `grid` poster or `storyboard` sprite is returned as WebP. The
        storyboard variant applies only to successfully probed videos of at
        least two seconds and is published only when every planned frame and
        the final sprite succeed. If work is queued or running,
        the endpoint returns a structured `202` response and `Retry-After`; the
        frontend uses its canonical local placeholder and retries with backoff.
        A failed transform returns a stable safe error and never raw tool output.
        If a database-ready cache file is missing or has the wrong size, the
        server atomically returns the transform to the durable queue and responds
        with the same bounded pending state; it never regenerates media inline.
      x-requirements: [FR-MED-001, FR-MED-002, FR-MED-008, FR-MED-009, FR-MED-010, FR-MED-011, NFR-PERF-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '404': [asset_not_found]
        '409': [source_offline]
        '422': [unsupported_media, invalid_media, thumbnail_failed, media_processing_timeout]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/AssetIDParameter'
        - $ref: '#/components/parameters/ThumbnailVariantParameter'
        - $ref: '#/components/parameters/ThumbnailVersionParameter'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
      responses:
        '200':
          description: Ready WebP thumbnail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Private immutable caching for a fingerprinted transform.
              schema:
                type: string
                example: private, max-age=31536000, immutable
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '202':
          description: Thumbnail work is pending; no placeholder bytes are returned.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThumbnailPending'
        '304':
          description: The ready thumbnail has not changed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/assets/{assetId}/content:
    get:
      tags: [Media]
      operationId: getAssetContent
      summary: Read supported original media with validators and one byte range
      description: |
        Resolves the asset ID through the reliable index and opens the source
        through the filesystem boundary. The request never accepts a path.

        The endpoint supports a full response or exactly one RFC 9110 byte
        range, including open-ended and suffix ranges. Multiple, malformed, or
        unsatisfiable ranges return `416` and `Content-Range: bytes */<length>`;
        the server never silently serves a different range. `If-Range` selects
        a full `200` response when its validator no longer matches. Conditional
        requests can return `304`.
      x-requirements: [FR-MED-004, FR-MED-005, FR-MED-006, NFR-SAFE-001, NFR-SEC-001, NFR-PRIV-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '404': [asset_not_found]
        '409': [source_offline, source_missing, source_unreadable]
        '416': [range_not_satisfiable]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/AssetIDParameter'
        - $ref: '#/components/parameters/RangeHeader'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
        - $ref: '#/components/parameters/IfRangeHeader'
      responses:
        '200':
          $ref: '#/components/responses/FullMediaContent'
        '206':
          $ref: '#/components/responses/PartialMediaContent'
        '304':
          $ref: '#/components/responses/MediaNotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    head:
      tags: [Media]
      operationId: headAssetContent
      summary: Get original-media validators and length without a body
      description: |
        Returns the same representation metadata as a full GET and ignores a
        Range header. No response body is sent.
      x-requirements: [FR-MED-004, FR-MED-006, NFR-SAFE-001, NFR-SEC-001]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '404': [asset_not_found]
        '409': [source_offline, source_missing, source_unreadable]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/AssetIDParameter'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
      responses:
        '200':
          description: Original-media metadata.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Type:
              $ref: '#/components/headers/MediaContentType'
            Content-Disposition:
              $ref: '#/components/headers/InlineContentDisposition'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '304':
          $ref: '#/components/responses/MediaNotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

