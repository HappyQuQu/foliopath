  /api/v1/libraries/{libraryId}/scans:
    parameters:
      - $ref: '#/components/parameters/LibraryIDParameter'
    get:
      tags: [Scans]
      operationId: listLibraryScans
      summary: List full-scan history for a media library
      description: |
        Results use a query-bound opaque keyset cursor and are ordered by
        `createdAt` descending, then stable scan ID descending. Terminal,
        offline, cancelled, and interrupted runs remain history; they are not
        hidden by a later successful run.
      x-requirements: [FR-SCN-003, FR-SCN-004, FR-SCN-008]
      x-error-codes:
        '400': [invalid_request, invalid_cursor]
        '401': [authentication_required, session_expired]
        '404': [library_not_found]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/CursorParameter'
        - $ref: '#/components/parameters/LimitParameter'
      responses:
        '200':
          description: Scans sorted by creation time descending and stable scan ID.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Scans]
      operationId: requestLibraryScan
      summary: Request a full reconciliation scan
      description: |
        A new scan returns `202`. If the library already has a queued or running
        full scan, the service coalesces the request and returns that existing
        scan with `200`; it never starts a parallel full scan for the same library.
        The request commits a durable `manual` run before notifying workers and
        does not wait for filesystem traversal. Offline libraries may be queued
        so this endpoint is also the retry path; the worker rechecks the root and
        an offline outcome preserves the last reliable index. An active library
        removal rejects admission.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-LIB-006, FR-SCN-001, FR-SCN-004, FR-SCN-005]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '404': [library_not_found]
        '409': [idempotency_conflict]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: An existing queued or running scan was returned.
          headers:
            Location:
              description: Relative URL of the existing scan.
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRun'
        '202':
          description: A new full scan was queued.
          headers:
            Location:
              description: Relative URL of the new scan.
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/libraries/{libraryId}/media-processing:
    parameters:
      - $ref: '#/components/parameters/LibraryIDParameter'
    get:
      tags: [Media]
      operationId: getLibraryMediaProcessingProgress
      summary: Get thumbnail and video-preview generation progress for a library
      description: |
        Returns an aggregate projection of the durable per-asset derived-media
        queue. Thumbnail/poster work and lower-priority video storyboard work
        remain separate. `processed` includes both succeeded and terminally
        failed work so clients can show completion without hiding failures.
        Video preview totals are not stable while
        `videoPreviewsPendingEligibility` is non-zero because eligibility is
        determined only after the video's grid poster and metadata are ready.
      x-requirements: [FR-MED-013, FR-SCN-006, FR-MED-001, FR-MED-009, FR-MED-010, FR-UI-008]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '404': [library_not_found]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
