      tags: [System]
      operationId: getReleaseInformation
      summary: Get the installed version, stable release history, and update status
      description: |
        Uses a bounded, cached server-side check of the official stable release
        feed. Network failure never changes readiness or media behavior. This
        endpoint only reports updates; FolioPath never replaces its own container.
