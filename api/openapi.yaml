  /api/v1/ai/model-downloads/{downloadId}/install:
    parameters:
      - name: downloadId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    post:
      tags: [AI models]
      operationId: downloadAIModel
      summary: Download and verify a configured model into managed storage
      description: |
        Accepts only a catalog ID, never a URL, path or uploaded weight.
        Shares the durable model install queue with offline installation.
        Cancel through the existing operation cancellation endpoint. On failure
        retry with a new idempotency key; interrupted transfers restart from zero.
        Successful installation does not activate the model automatically.
        The same idempotency key replays its operation. A different key for an
        already active download returns 409 model_download_active.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-INT-017, FR-INT-019, NFR-INT-007, NFR-INT-009, NFR-INT-010]
      x-error-codes:
        '400': [invalid_request]
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '409': [model_download_unavailable, model_download_active, idempotency_conflict]
        '422': [model_incompatible]
        '429': [rate_limited]
        '500': [internal_error]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Download queued. Progress represents received bytes; installation verifies all hashes.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: Relative operation URL.
              schema:
                type: string
            Idempotency-Replayed:
              description: Whether the prior operation was returned.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

