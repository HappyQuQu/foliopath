  /api/v1/ai/model-candidate-scans:
    post:
      tags: [AI models]
      operationId: scanAIModelCandidates
      summary: Scan the fixed read-only model directory
      description: |
        Scans only the server-configured `/models` boundary. The request has no
        path, URL, source, proxy, mirror, or filename field. Candidate IDs bind
        the resulting scan revision and expire when the source changes.
        Before scanning candidates, the server revalidates every installed
        managed/direct package against its reviewed manifest and updates only
        its availability state; active generation metadata and embeddings are
        preserved when a source is unavailable.
        Online model acquisition uses the separate configured download catalog.
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-INT-017, FR-INT-018, NFR-INT-007, NFR-INT-008, NFR-INT-010]
      x-error-codes:
        '401': [authentication_required, session_expired]
        '403': [csrf_invalid]
        '409': [model_source_unavailable]
        '429': [rate_limited]
        '500': [internal_error]
      responses:
        '200':
          description: A bounded safe snapshot of reviewed and rejected candidates.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelCandidateScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ai/model-candidates/{candidateId}/install:
    parameters:
      - $ref: '#/components/parameters/AIModelCandidateIDParameter'
    post:
      tags: [AI models]
      operationId: installAIModelCandidate
      summary: Install one candidate by managed copy or strict direct reference
      security:
        - cookieAuth: []
          csrfToken: []
      x-requirements: [FR-INT-017, FR-INT-018, FR-INT-019, NFR-INT-007, NFR-INT-009, NFR-INT-010]
