<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UIF-408 four-breakpoint page comparison</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0d0f12;
        color: #f3f5f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      header {
        position: sticky;
        z-index: 2;
        top: 0;
        margin: -24px -24px 24px;
        padding: 18px 24px;
        border-bottom: 1px solid #2b3038;
        background: rgb(13 15 18 / 92%);
        backdrop-filter: blur(18px);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      header p,
      figcaption {
        color: #aeb6c2;
      }
      header p {
        margin: 0;
        font-size: 14px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        overflow: hidden;
        border: 1px solid #2b3038;
        border-radius: 14px;
        background: #15181d;
      }
      h2 {
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid #2b3038;
        font-size: 16px;
      }
      .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        background: #2b3038;
      }
      figure {
        min-width: 0;
        margin: 0;
        padding: 12px;
        background: #101318;
      }
      img {
        display: block;
        width: 100%;
        height: 250px;
        object-fit: contain;
        object-position: top center;
        border: 1px solid #343b45;
        border-radius: 8px;
        background: #090a0c;
      }
      figcaption {
        margin-top: 8px;
        font-size: 12px;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">UIF-408 page comparison</h1>
      <p>左：最新原型；右：真实生产路由。同一 CSS viewport、简体中文、深色主题。</p>
    </header>
    <main id="matrix"></main>
    <script>
      const ids = [
        "account",
        "auth-login",
        "auth-setup",
        "browse",
        "general",
        "libraries",
        "library-new",
        "library-status",
        "search",
        "storage",
        "viewer",
        "welcome",
      ];
      const viewport =
        new URLSearchParams(location.search).get("viewport") || "390x844";
      document.querySelector("#title").textContent =
        `UIF-408 · ${viewport} · 12 pages`;
      document.querySelector("#matrix").innerHTML = ids
        .map(
          (id) => `
            <article>
              <h2>${id}</h2>
              <div class="pair">
                <figure>
                  <img src="source/${id}-${viewport}.jpg" alt="${id} prototype at ${viewport}" />
                  <figcaption>Prototype · ${viewport}</figcaption>
                </figure>
                <figure>
                  <img src="implementation/${id}-${viewport}.jpg" alt="${id} production at ${viewport}" />
                  <figcaption>Production · ${viewport}</figcaption>
                </figure>
              </div>
            </article>`,
        )
        .join("");
    </script>
  </body>
</html>
