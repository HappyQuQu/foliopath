<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UIF-401 逐页原型 / 生产组合比较</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "SF Pro Text", "PingFang SC", system-ui, -apple-system,
          sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        padding: 18px 24px;
        border-bottom: 1px solid #d2d2d7;
        background: rgb(245 245 247 / 92%);
        backdrop-filter: blur(16px);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
      }

      header p {
        margin-top: 6px;
        color: #6e6e73;
        font-size: 13px;
      }

      main {
        display: grid;
        gap: 24px;
        padding: 24px;
      }

      article {
        overflow: hidden;
        border: 1px solid #d2d2d7;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 10px 30px rgb(0 0 0 / 6%);
      }

      article > h2 {
        margin: 0;
        padding: 14px 18px;
        border-bottom: 1px solid #e8e8ed;
        font-size: 17px;
      }

      .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      figure {
        min-width: 0;
        margin: 0;
        padding: 12px;
      }

      figure + figure {
        border-left: 1px solid #d2d2d7;
      }

      figcaption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        color: #6e6e73;
        font-size: 12px;
      }

      figcaption strong {
        color: #1d1d1f;
        font-size: 13px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #e8e8ed;
        border-radius: 10px;
        background: #fff;
      }

      @media (max-width: 760px) {
        header,
        main {
          padding-inline: 14px;
        }

        .pair {
          grid-template-columns: 1fr;
        }

        figure + figure {
          border-top: 1px solid #d2d2d7;
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>UIF-401 逐页原型 / 生产组合比较</h1>
      <p>
        左侧为最新原型来源，右侧为真实生产路由；均在 1280 × 720 CSS
        视口、简体中文、深色主题下取证。原始截图不缩放保存在 source/ 与 implementation/。
      </p>
    </header>
    <main id="comparisons"></main>
    <script>
      const pages = [
        ["auth-login", "登录"],
        ["auth-setup", "首次管理员设置"],
        ["welcome", "首次使用欢迎"],
        ["libraries", "媒体库"],
        ["library-new", "新建媒体库"],
        ["library-status", "媒体库扫描状态"],
        ["general", "通用设置"],
        ["storage", "扫描与缓存"],
        ["account", "账户"],
        ["browse", "浏览"],
        ["search", "搜索"],
        ["viewer", "查看器"],
      ];
      const requestedPage = new URLSearchParams(location.search).get("page");
      const selected = requestedPage
        ? pages.filter(([id]) => id === requestedPage)
        : pages;
      const root = document.querySelector("#comparisons");

      for (const [id, label] of selected) {
        const article = document.createElement("article");
        article.id = id;
        article.innerHTML = `
          <h2>${label} · ${id}</h2>
          <div class="pair">
            <figure>
              <figcaption><strong>最新原型</strong><span>1280 × 720 CSS viewport</span></figcaption>
              <img alt="${label}原型截图" src="source/${id}-1280x720.png" />
            </figure>
            <figure>
              <figcaption><strong>生产实现</strong><span>1280 × 720 CSS viewport</span></figcaption>
              <img alt="${label}生产截图" src="implementation/${id}-1280x720.png" />
            </figure>
          </div>
        `;
        root.append(article);
      }
    </script>
  </body>
</html>
