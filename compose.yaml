services:
  foliopath:
    image: ${FOLIOPATH_IMAGE:-evanqu/foliopath:latest}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    environment:
      TZ: ${TZ:-UTC}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=0,gid=0,mode=0700
    ports:
      - "${FOLIOPATH_BIND_ADDRESS:-0.0.0.0}:${FOLIOPATH_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${FOLIOPATH_LIBRARY_PATH:-./library}
        target: /library
        read_only: true
      - type: bind
        source: ${FOLIOPATH_DATA_PATH:-./data}
        target: /app/data
