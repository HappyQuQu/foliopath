<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FolioPath — 欢迎</title>
  <meta name="description" content="FolioPath 欢迎页 — 创建您的第一个媒体库">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <div class="app-shell" style="grid-template-columns: 1fr;">
    <div class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <span style="font: var(--text-title-3); letter-spacing: var(--tracking-tight);">FolioPath</span>
        <div style="flex: 1;"></div>
        <button class="icon-btn" onclick="toggleTheme()" aria-label="切换主题">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <span style="font: var(--text-footnote); color: var(--text-secondary);">管理员</span>
      </header>

      <!-- Welcome Content -->
      <main id="main-content">
        <div class="welcome-wrapper">
          <div class="welcome-card">
            <div class="welcome-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>

            <p class="eyebrow">开始使用</p>
            <h1>欢迎使用 FolioPath</h1>
            <p class="desc">
              FolioPath 以只读方式浏览您已有的照片和视频目录。原始文件不会被移动、修改或删除。请先将媒体目录挂载到容器的 <code style="font-family: var(--font-mono); background: var(--fill); padding: 2px 6px; border-radius: 4px; font-size: 14px;">/library</code>，然后在此创建媒体库。
            </p>

            <div class="welcome-actions">
              <a href="06-settings-libraries.html" class="btn btn-primary btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                创建媒体库
              </a>
              <button class="btn btn-secondary btn-lg">查看挂载说明</button>
            </div>

            <!-- Docker help -->
            <div class="welcome-help">
              <strong style="font: var(--text-footnote); font-weight: 600;">Docker Compose 推荐配置</strong>
              <code>
volumes:<br>
&nbsp;&nbsp;- /your/media:/library:ro<br>
&nbsp;&nbsp;- foliopath_data:/app/data
              </code>
              <span class="hint">只读挂载确保您的原始文件绝对安全。数据目录用于存储索引和缩略图缓存。</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
