<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FolioPath — 欢迎</title>
  <meta name="description" content="FolioPath 欢迎页 — 创建您的第一个媒体库">
  <link rel="icon" href="assets/foliopath-mark-tree.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260730-14">
  <script src="theme.js?v=20260730-8"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <header class="global-header" data-global-header></header>
  <div class="app-layout">
  <div class="app-shell" style="grid-template-columns: 1fr;">
    <div class="main-content">
      <main id="main-content">
        <div class="welcome-wrapper">
          <div class="welcome-card">
            <div class="welcome-icon">
              <img src="assets/foliopath-mark-tree.svg" alt="" aria-hidden="true">
            </div>

            <p class="eyebrow">开始使用</p>
            <h1>欢迎使用 FolioPath</h1>
            <p class="desc">
              FolioPath 以只读方式浏览您已有的照片和视频目录。原始文件不会被移动、修改或删除。请先将媒体目录挂载到容器的 <code style="font-family: var(--font-mono); background: var(--fill); padding: 2px 6px; border-radius: 4px; font-size: 14px;">/library</code>，然后在此创建媒体库。
            </p>

            <div class="welcome-actions">
              <a href="06-settings-libraries.html" class="btn btn-primary btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                创建媒体库
              </a>
              <button class="btn btn-secondary btn-lg">查看挂载说明</button>
            </div>

            <!-- Docker help -->
            <div class="welcome-help">
              <strong style="font: var(--text-footnote); font-weight: 600;">Docker Compose 推荐配置</strong>
              <code>
volumes:<br>
&nbsp;&nbsp;- /your/media:/library:ro<br>
&nbsp;&nbsp;- foliopath_data:/app/data
              </code>
              <span class="hint">只读挂载确保您的原始文件绝对安全。数据目录用于存储索引和缩略图缓存。</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  </div>
</body>
</html>
