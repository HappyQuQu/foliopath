<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>媒体库 — FolioPath</title>
  <meta name="description" content="FolioPath 媒体库设置">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="global-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="03-browse.html" class="brand">FolioPath</a>
    </div>

    <div class="global-header-right">
      <span class="admin-badge">管理员</span>
    </div>
  </header>
  <div class="app-layout">
  <main class="settings-split-layout">

      <!-- Left Sidebar -->
      <aside class="settings-sidebar">
        <h2>设置</h2>
        <ul class="settings-nav-list">
          <li>
            <a href="07-settings-general.html" class="settings-nav-item ">
              <div class="settings-nav-icon general">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
              </div>
              通用
            </a>
          </li>
          <li>
            <a href="06-settings-libraries.html" class="settings-nav-item active">
              <div class="settings-nav-icon library">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
              </div>
              媒体库
            </a>
          </li>
        </ul>
      </aside>

      <!-- Right Pane -->
      <div class="settings-pane">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-8);">
          <h1 style="font: var(--text-large-title);">媒体库</h1>
          <button class="btn btn-primary btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加媒体库
          </button>
        </div>

        <h3 class="settings-panel-header" style="font: var(--text-headline); color: var(--text-secondary); margin-bottom: 8px; padding-left: 16px;">已挂载的目录</h3>

        <div class="settings-group">
          <!-- Item 1 -->
          <div class="settings-item" style="align-items: flex-start;">
            <div class="settings-item-info">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                <span class="library-status ready" style="margin:0;"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg> 就绪</span>
                <strong style="margin:0;">家庭影像</strong>
              </div>
              <span style="font-family: var(--font-mono); margin-bottom: 4px;">/library/家庭影像</span>
              <span>12,480 项 · 上次扫描: 2026-07-29</span>
            </div>
            <div class="settings-item-control">
              <button class="btn btn-secondary btn-sm" aria-label="更多操作">...</button>
            </div>
          </div>

          <!-- Item 2 -->
          <div class="settings-item" style="align-items: flex-start;">
            <div class="settings-item-info">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                <span class="library-status scanning" style="margin:0;"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="animation: spin 1s linear infinite;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg> 扫描中</span>
                <strong style="margin:0;">旅行摄影</strong>
              </div>
              <span style="font-family: var(--font-mono); margin-bottom: 4px;">/library/旅行</span>
              <span>已发现 5,320 项</span>
            </div>
            <div class="settings-item-control">
              <button class="btn btn-secondary btn-sm" aria-label="更多操作">...</button>
            </div>
          </div>

          <!-- Item 3 -->
          <div class="settings-item" style="align-items: flex-start;">
            <div class="settings-item-info">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                <span class="library-status offline" style="margin:0;"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg> 离线</span>
                <strong style="margin:0;">工作素材</strong>
              </div>
              <span style="font-family: var(--font-mono); margin-bottom: 4px;">/library/工作</span>
              <span>保留 3,210 项</span>
            </div>
            <div class="settings-item-control">
              <button class="btn btn-secondary btn-sm" aria-label="更多操作">...</button>
            </div>
          </div>
        </div>
      </div>
  </main>
  </div>
</body>
</html>
