<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>媒体库 — FolioPath</title>
  <meta name="description" content="FolioPath 媒体库设置">
  <link rel="icon" href="assets/foliopath-mark-tree.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260730-15">
  <script src="theme.js?v=20260730-8"></script>
  <script src="settings.js?v=20260730-2" defer></script>
</head>
<body data-settings-page="libraries">
  <header class="global-header" data-global-header></header>
  <div class="app-layout">
    <main class="settings-split-layout">
      <aside class="settings-sidebar" data-settings-sidebar data-active="libraries"></aside>

      <div class="settings-pane" id="main-content">
        <div class="settings-hero settings-hero-row">
          <div>
            <p class="eyebrow">管理中心</p>
            <h1>媒体库</h1>
            <p>管理 FolioPath 可以浏览的只读目录、连接状态和扫描任务。</p>
          </div>
          <button class="btn btn-primary" type="button" data-open-add-library>
            新建媒体库
          </button>
        </div>

        <div class="inline-status info settings-note">
          <span>媒体库只引用 <code>/library</code> 下的目录。原始文件永远不会被移动、修改或删除。</span>
        </div>

        <section aria-labelledby="library-list-title">
          <div class="settings-section-heading">
            <h2 class="settings-section-title" id="library-list-title">已配置的媒体库</h2>
            <span class="settings-section-meta" data-library-summary></span>
          </div>
          <div class="library-management-list" data-library-list></div>
        </section>
      </div>
    </main>
  </div>

  <div class="dialog-scrim" hidden data-dialog="add-library">
    <section class="dialog settings-dialog" role="dialog" aria-modal="true" aria-labelledby="add-library-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">新建媒体库</p>
          <h2 id="add-library-title">选择只读媒体目录</h2>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" data-close-dialog>关闭</button>
      </div>
      <form data-add-library-form novalidate>
        <label class="field">
          <span>媒体库名称</span>
          <input type="text" name="name" maxlength="48" autocomplete="off" placeholder="例如：家庭影像" required>
          <small>名称必须非空，并且不能与现有媒体库重复。</small>
          <strong class="field-error" hidden data-error-for="name"></strong>
        </label>

        <fieldset class="path-picker">
          <legend>根目录</legend>
          <div class="path-breadcrumb"><span>/library</span><strong data-selected-path>尚未选择</strong></div>
          <div class="path-options" data-path-options></div>
          <input type="hidden" name="path" required>
          <strong class="field-error" hidden data-error-for="path"></strong>
        </fieldset>

        <div class="dialog-actions">
          <button class="btn btn-secondary" type="button" data-close-dialog>取消</button>
          <button class="btn btn-primary" type="submit">创建并开始扫描</button>
        </div>
      </form>
    </section>
  </div>

  <div class="dialog-scrim" hidden data-dialog="rename-library">
    <section class="dialog settings-dialog" role="dialog" aria-modal="true" aria-labelledby="rename-library-title">
      <h2 id="rename-library-title">重命名媒体库</h2>
      <p>根目录保持不变。新名称必须在当前实例内唯一。</p>
      <form data-rename-library-form novalidate>
        <input type="hidden" name="id">
        <label class="field">
          <span>媒体库名称</span>
          <input type="text" name="name" maxlength="48" required>
          <strong class="field-error" hidden data-error-for="rename"></strong>
        </label>
        <div class="dialog-actions">
          <button class="btn btn-secondary" type="button" data-close-dialog>取消</button>
          <button class="btn btn-primary" type="submit">保存名称</button>
        </div>
      </form>
    </section>
  </div>

  <div class="dialog-scrim" hidden data-dialog="remove-library">
    <section class="dialog settings-dialog" role="alertdialog" aria-modal="true" aria-labelledby="remove-library-title">
      <h2 id="remove-library-title">从 FolioPath 移除媒体库？</h2>
      <p data-remove-library-copy></p>
      <ul class="danger-list">
        <li>移除媒体库配置、索引和未完成任务</li>
        <li>清理该媒体库的可重建缩略图缓存</li>
        <li><strong>不会删除、移动或修改任何原始文件</strong></li>
      </ul>
      <form data-remove-library-form>
        <input type="hidden" name="id">
        <div class="dialog-actions">
          <button class="btn btn-secondary" type="button" data-close-dialog>取消</button>
          <button class="btn btn-danger" type="submit">确认移除</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" role="status" hidden data-toast></div>
</body>
</html>
