<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户 — FolioPath</title>
  <meta name="description" content="FolioPath 管理员账户">
  <link rel="icon" href="assets/foliopath-mark-tree.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260730-15">
  <script src="theme.js?v=20260730-8"></script>
  <script src="settings.js?v=20260730-2" defer></script>
</head>
<body data-settings-page="account">
  <header class="global-header" data-global-header></header>
  <div class="app-layout">
    <main class="settings-split-layout">
      <aside class="settings-sidebar" data-settings-sidebar data-active="account"></aside>

      <div class="settings-pane" id="main-content">
        <div class="settings-hero">
          <p class="eyebrow">管理中心</p>
          <h1>账户</h1>
          <p>管理唯一管理员的显示信息、密码和当前登录会话。</p>
        </div>

        <section aria-labelledby="profile-title">
          <h2 class="settings-section-title" id="profile-title">管理员资料</h2>
          <form class="settings-card-form" data-profile-form novalidate>
            <div class="form-grid">
              <label class="field">
                <span>显示名称</span>
                <input type="text" name="displayName" maxlength="48" required>
                <strong class="field-error" hidden data-error-for="displayName"></strong>
              </label>
              <label class="field">
                <span>用户名</span>
                <input type="text" name="username" value="admin" readonly aria-describedby="username-note">
                <small id="username-note">首个稳定版不支持修改管理员用户名。</small>
              </label>
            </div>
            <div class="form-footer">
              <span class="settings-save-state" data-profile-state aria-live="polite">没有未保存的更改</span>
              <button class="btn btn-primary" type="submit" disabled data-save-profile>保存资料</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="password-title">
          <h2 class="settings-section-title" id="password-title">修改密码</h2>
          <form class="settings-card-form" data-password-form novalidate>
            <div class="form-grid one-column">
              <label class="field">
                <span>当前密码</span>
                <input type="password" name="currentPassword" autocomplete="current-password" required>
                <strong class="field-error" hidden data-error-for="currentPassword"></strong>
              </label>
              <label class="field">
                <span>新密码</span>
                <input type="password" name="newPassword" autocomplete="new-password" minlength="8" required>
                <small>至少 8 个 Unicode 字符，不强制组合规则。</small>
                <strong class="field-error" hidden data-error-for="newPassword"></strong>
              </label>
              <label class="field">
                <span>确认新密码</span>
                <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required>
                <strong class="field-error" hidden data-error-for="confirmPassword"></strong>
              </label>
            </div>
            <div class="form-footer">
              <span class="settings-caption">保存后当前会话继续有效，其他会话需重新登录。</span>
              <button class="btn btn-primary" type="submit">更新密码</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="session-title">
          <h2 class="settings-section-title" id="session-title">当前会话</h2>
          <div class="settings-group">
            <div class="settings-item">
              <div class="settings-item-info">
                <strong>此浏览器</strong>
                <span>当前活动 · 受信局域网 · 最后活动：刚刚</span>
              </div>
              <div class="settings-item-control">
                <button class="btn btn-danger btn-sm" type="button" data-open-logout>退出登录</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="dialog-scrim" hidden data-dialog="logout">
    <section class="dialog settings-dialog" role="alertdialog" aria-modal="true" aria-labelledby="logout-title">
      <h2 id="logout-title">退出当前会话？</h2>
      <p>退出后需要重新输入管理员用户名和密码才能访问媒体与设置。</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary" type="button" data-close-dialog>取消</button>
        <a class="btn btn-danger" href="01-auth.html" data-confirm-logout>退出登录</a>
      </div>
    </section>
  </div>

  <div class="toast" role="status" hidden data-toast></div>
</body>
</html>
