<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通用设置 — FolioPath</title>
  <meta name="description" content="FolioPath 通用设置">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="global-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="03-browse.html" class="brand">FolioPath</a>
    </div>

    <div class="global-header-right">
      <span class="admin-badge">管理员</span>
    </div>
  </header>
  <div class="app-layout">
  <main class="settings-split-layout">

      <!-- Left Sidebar -->
      <aside class="settings-sidebar">
        <h2>设置</h2>
        <ul class="settings-nav-list">
          <li>
            <a href="07-settings-general.html" class="settings-nav-item active">
              <div class="settings-nav-icon general">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
              </div>
              通用
            </a>
          </li>
          <li>
            <a href="06-settings-libraries.html" class="settings-nav-item ">
              <div class="settings-nav-icon library">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
              </div>
              媒体库
            </a>
          </li>
        </ul>
      </aside>

      <!-- Right Pane -->
      <div class="settings-pane">
        <h1 style="font: var(--text-large-title); margin-bottom: var(--space-8);">通用</h1>

        <h3 class="settings-panel-header" style="font: var(--text-headline); color: var(--text-secondary); margin-bottom: 8px; padding-left: 16px;">外观与语言</h3>
        <div class="settings-group">
          <div class="settings-item">
            <div class="settings-item-info">
              <strong>主题</strong>
              <span>选择浅色、深色主题。</span>
            </div>
            <div class="settings-item-control">
              <input type="checkbox" class="apple-switch" onclick="toggleTheme()" aria-label="切换主题">
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-item-info">
              <strong>语言</strong>
              <span>界面显示语言。</span>
            </div>
            <div class="settings-item-control">
              <select>
                <option selected>简体中文</option>
                <option>English</option>
              </select>
            </div>
          </div>
        </div>

        <h3 class="settings-panel-header" style="font: var(--text-headline); color: var(--text-secondary); margin-bottom: 8px; padding-left: 16px; margin-top: 32px;">扫描与缓存</h3>
        <div class="settings-group">
          <div class="settings-item">
            <div class="settings-item-info">
              <strong>定时完整扫描</strong>
              <span>按照设定间隔自动执行完整扫描。</span>
            </div>
            <div class="settings-item-control">
              <input type="checkbox" class="apple-switch" checked>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-item-info">
              <strong>扫描间隔（小时）</strong>
              <span>默认每 24 小时执行一次。</span>
            </div>
            <div class="settings-item-control">
              <input type="number" value="24" min="1" max="8760" style="width: 80px;">
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-item-info">
              <strong>缩略图缓存配额（GiB）</strong>
              <span>达到配额后将自动清理最久未使用项。</span>
            </div>
            <div class="settings-item-control">
              <input type="number" value="10" min="0.01" step="0.1" style="width: 80px;">
            </div>
          </div>
        </div>

        <div class="inline-status info" style="margin-top: 16px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>系统会自动为 SQLite 数据库保留安全的磁盘余量。</span>
        </div>

        <h3 class="settings-panel-header" style="font: var(--text-headline); color: var(--text-secondary); margin-bottom: 8px; padding-left: 16px; margin-top: 32px;">账户</h3>
        <div class="settings-group">
          <div class="settings-item">
            <div class="settings-item-info">
              <strong>管理员</strong>
              <span>用户名: admin</span>
            </div>
            <div class="settings-item-control">
              <button class="btn btn-secondary btn-sm" style="color: var(--danger);">退出登录</button>
            </div>
          </div>
        </div>
      </div>
  </main>
  </div>
</body>
</html>
