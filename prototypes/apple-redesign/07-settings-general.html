<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通用设置 — FolioPath</title>
  <meta name="description" content="FolioPath 通用设置">
  <link rel="icon" href="assets/foliopath-mark-tree.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260730-15">
  <script src="theme.js?v=20260730-8"></script>
  <script src="settings.js?v=20260730-2" defer></script>
</head>
<body data-settings-page="general">
  <header class="global-header" data-global-header></header>
  <div class="app-layout">
    <main class="settings-split-layout">
      <aside class="settings-sidebar" data-settings-sidebar data-active="general"></aside>

      <div class="settings-pane" id="main-content">
        <div class="settings-hero">
          <p class="eyebrow">管理中心</p>
          <h1>通用</h1>
          <p>调整界面显示和浏览偏好。更改只影响当前 FolioPath 管理员。</p>
        </div>

        <form class="settings-form" data-general-form novalidate>
          <section aria-labelledby="appearance-title">
            <h2 class="settings-section-title" id="appearance-title">外观与语言</h2>
            <div class="settings-group">
              <label class="settings-item" for="theme-preference">
                <span class="settings-item-info">
                  <strong>主题</strong>
                  <span>跟随系统，或固定使用浅色、深色外观。</span>
                </span>
                <span class="settings-item-control">
                  <select id="theme-preference" name="theme">
                    <option value="system">跟随系统</option>
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                  </select>
                </span>
              </label>
              <label class="settings-item" for="language-preference">
                <span class="settings-item-info">
                  <strong>语言</strong>
                  <span>默认跟随浏览器语言，也可以手动覆盖。</span>
                </span>
                <span class="settings-item-control">
                  <select id="language-preference" name="language">
                    <option value="browser">跟随浏览器</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="en">English</option>
                  </select>
                </span>
              </label>
            </div>
          </section>

          <section aria-labelledby="browse-title">
            <h2 class="settings-section-title" id="browse-title">浏览偏好</h2>
            <div class="settings-group">
              <label class="settings-item" for="layout-preference">
                <span class="settings-item-info">
                  <strong>默认布局</strong>
                  <span>新打开目录时采用的媒体排列方式。</span>
                </span>
                <span class="settings-item-control">
                  <select id="layout-preference" name="layout">
                    <option value="grid">自适应网格</option>
                    <option value="masonry">瀑布流</option>
                  </select>
                </span>
              </label>
              <label class="settings-item" for="preview-preference">
                <span class="settings-item-info">
                  <strong>默认固定预览</strong>
                  <span>在桌面浏览页打开时保持右侧预览面板。</span>
                </span>
                <span class="settings-item-control">
                  <input id="preview-preference" name="previewPinned" type="checkbox" class="apple-switch">
                </span>
              </label>
            </div>
          </section>

          <div class="settings-savebar">
            <span class="settings-save-state" data-save-state aria-live="polite">没有未保存的更改</span>
            <div class="settings-save-actions">
              <button class="btn btn-secondary" type="button" data-reset-general>恢复已保存值</button>
              <button class="btn btn-primary" type="submit" disabled data-save-general>保存更改</button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>
  <div class="toast" role="status" hidden data-toast></div>
</body>
</html>
