name: Native release image verification

on:
  workflow_call:
    inputs:
      verification_only:
        type: boolean
        required: false
        default: false
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  image:
    if: ${{ !inputs.verification_only }}
    name: Build and verify ${{ matrix.component }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.component == 'ai' && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            component: main
          - arch: arm64
            runner: ubuntu-24.04-arm
            component: main
          - arch: amd64
            runner: ubuntu-24.04
            component: ai
          - arch: arm64
            runner: ubuntu-24.04-arm
            component: ai
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore compiler and package cache mounts
        id: cache
        uses: actions/cache/restore@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/native-cache
          key: native-mounts-v1-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'go.sum', 'web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            native-mounts-v1-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'go.sum', 'web/package-lock.json') }}-

      - name: Inject cache mounts into this builder
        timeout-minutes: 3
        continue-on-error: true
        run: python3 scripts/buildkit_cache_mounts.py inject --directory "${RUNNER_TEMP}/native-cache"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image plan
        uses: actions/download-artifact@v4
        with:
          name: image-plan
          path: ${{ runner.temp }}/image-plan

      - name: Bind component publication plan
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [ "$COMPONENT" = ai ]; then
            python3 scripts/native_release.py managed-plan \
              --plan "${RUNNER_TEMP}/image-plan/image-plan.json" \
              --output "${RUNNER_TEMP}/image-plan/component-plan.json"
          else
            cp "${RUNNER_TEMP}/image-plan/image-plan.json" "${RUNNER_TEMP}/image-plan/component-plan.json"
          fi

      - name: Read validated image labels
        id: metadata
        run: |
          python3 scripts/native_release.py labels \
            --plan "${RUNNER_TEMP}/image-plan/component-plan.json" \
            --output "${GITHUB_OUTPUT}"

      - name: Build final native image once by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.metadata.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
          outputs: type=image,name=evanqu/foliopath,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=foliopath-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,scope=foliopath-${{ matrix.component }}-${{ matrix.arch }},mode=max
          sbom: true
          provenance: true

      - name: Verify exact image and record successful digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/native_release.py verify \
            --plan "${RUNNER_TEMP}/image-plan/component-plan.json" \
            --arch "${ARCH}" --digest "${DIGEST}" \
            --output "${RUNNER_TEMP}/verified-digests/${ARCH}.json"

      - name: Export updated cache mounts
        id: export
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        run: python3 scripts/buildkit_cache_mounts.py extract --directory "${RUNNER_TEMP}/native-cache"

      - name: Save compiler and package cache mounts
        if: ${{ !cancelled() && steps.export.outcome == 'success' && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/native-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload verified digest
        uses: actions/upload-artifact@v4
        with:
          name: verified-digest-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/verified-digests
          if-no-files-found: error
          retention-days: 7

  verification-image:
    name: Verify ${{ matrix.kind }} on native ${{ matrix.arch }} without promotion
    if: ${{ inputs.verification_only }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        kind: [main, ai]
        arch: [amd64, arm64]
    steps:
      - name: Checkout exact verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Prove native runner and bind verification-only plan
        env:
          SOURCE: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          KIND: ${{ matrix.kind }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE}"
          test -z "${DOCKER_DEFAULT_PLATFORM:-}"
          case "${ARCH}" in
            amd64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
          esac
          python3 scripts/native_release.py verification-plan --kind "${KIND}" \
            --output "${RUNNER_TEMP}/verification/image-plan.json"
          uname -sm > "${RUNNER_TEMP}/verification/native-platform.txt"
          docker info --format '{{.OSType}}/{{.Architecture}}' >> "${RUNNER_TEMP}/verification/native-platform.txt"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub for digest-only storage
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read the controlled image and recipe
        id: metadata
        run: |
          python3 scripts/native_release.py labels \
            --plan "${RUNNER_TEMP}/verification/image-plan.json" --output "${GITHUB_OUTPUT}"

      - name: Build this final native image exactly once without tags
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.metadata.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
          outputs: |
            type=oci,dest=${{ runner.temp }}/verification/native.oci.tar,oci-mediatypes=true
            type=image,name=${{ steps.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=verification-${{ matrix.kind }}-${{ matrix.arch }}
          cache-to: type=gha,scope=verification-${{ matrix.kind }}-${{ matrix.arch }},mode=max
          sbom: true
          provenance: true

      - name: Preserve original build metadata
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"verification/build-metadata.json"; p.write_text(json.dumps(json.loads(os.environ["BUILD_METADATA"]),sort_keys=True,indent=2)+"\n")'

      - name: Verify the exact digest and preserve SPDX and SLSA
        env:
          SOURCE: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/native_release.py verify \
            --plan "${RUNNER_TEMP}/verification/image-plan.json" --arch "${ARCH}" \
            --digest "${DIGEST}" --output "${RUNNER_TEMP}/verification/verified.json" \
            --oci-archive "${RUNNER_TEMP}/verification/native.oci.tar"

      - name: Upload exact-digest verification and limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.kind }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 7
