name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify formatting, architecture, contract, and vet
        run: make fmt-check lint
      - name: Run tests
        run: make test test-integration
      - name: Run race tests
        run: make test-race

  scan-capacity:
    name: Scan capacity (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run the two-core, 4 GiB scan and search CI guard
        run: |
          docker run --rm \
            --cpus=2 \
            --memory=4g \
            --tmpfs /tmp:rw,exec,size=2g \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --workdir /workspace \
            --env FOLIOPATH_CAPACITY=1 \
            --env FOLIOPATH_CAPACITY_ENFORCE_BUDGET=1 \
            --env GOMAXPROCS=2 \
            --env GOMODCACHE=/tmp/gomodcache \
            --env GOCACHE=/tmp/gocache \
            golang:1.26.5-trixie@sha256:4ee9ffa999b4583ce281939cdff828763083610292f252279a0cee77473bd9a7 \
            go test -timeout=20m -count=1 \
              -run '^Test(CapacityBaseline|DirectoryRollupDeepChainBaseline)$' \
              -v ./tests/performance

  web-contract:
    name: Generated web contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Node dependencies
        run: npm ci --prefix web
      - name: Reject high-severity Node dependency findings
        run: npm --prefix web run audit:high
      - name: Verify generated SQL, API types, and the typed client boundary
        run: make generate-check web-check
      - name: Cross-check the OpenAPI document
        run: make openapi-lint
      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:api/openapi.yaml"; then
            git show "${BASE_SHA}:api/openapi.yaml" > "${RUNNER_TEMP}/openapi-base.yaml"
            make compatibility-check \
              OPENAPI_BASELINE="${RUNNER_TEMP}/openapi-base.yaml"
          else
            echo "Initial OpenAPI addition: no base-branch contract exists to compare."
          fi

  media-matrix:
    name: Synthetic media (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg webp
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Run the synthetic media matrix
        run: |
          tests/fixtures/media-matrix/verify.sh
          go test -count=1 -run '^TestSyntheticVideoMatrixThroughProductionAdapter$' \
            ./internal/media/videoffmpeg

  vips-spike:
    name: Govips spike (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache-dependency-path: spikes/fs03-vips/go.sum
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips-dev
          pkg-config --modversion vips
      - name: Run the bounded govips fixture
        env:
          GOMAXPROCS: "4"
          MALLOC_ARENA_MAX: "2"
        run: |
          cd spikes/fs03-vips
          timeout 2m go test -count=1 -v ./...
          cd ../..
          timeout 2m go test -tags libvips -count=1 -v ./internal/media/imagevips
          timeout 2m go test -tags libvips -count=1 \
            -run '^TestComposeOwnsValidatedConfiguration$' ./internal/app
      - name: Run the real full-filesystem cache fixture
        run: |
          media_cache_root=/mnt/foliopath-media-cache
          sudo mkdir -p "${media_cache_root}"
          sudo mount -t tmpfs -o size=8m tmpfs "${media_cache_root}"
          sudo chmod 0770 "${media_cache_root}"
          trap 'sudo umount "${media_cache_root}"' EXIT
          sudo chown "$(id -u):$(id -g)" "${media_cache_root}"
          FOLIOPATH_FULL_CACHE_ROOT="${media_cache_root}" \
            go test -count=1 -tags mediafull \
            -run '^TestPublisherCleansTemporaryFileAfterRealDiskFull$' \
            ./internal/thumbnail/cachefs

  mount-boundary:
    name: Linux mount boundary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run isolated privileged probes
        run: |
          docker run --rm \
            --privileged \
            --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/src,readonly \
            --workdir /src \
            --env GOMODCACHE=/tmp/mod \
            --env GOCACHE=/tmp/cache \
            golang:1.26.5-trixie@sha256:4ee9ffa999b4583ce281939cdff828763083610292f252279a0cee77473bd9a7 \
            sh -c "go test -count=1 -tags fsboundary ./tests/integration \
              -run '^TestFS01Rejects.*BindMount$' &&
              go test -race -count=1 -tags fsboundary ./tests/integration \
              -run '^TestFS01Rejects.*BindMount$'"

  runtime-spike:
    name: Runtime and recovery (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build the native runtime spike image
        run: |
          docker build -f spikes/fs05-runtime/Dockerfile \
            -t "foliopath-fs05:${GITHUB_SHA}-${{ matrix.arch }}" \
            --build-arg VERSION="${GITHUB_SHA}" .
      - name: Verify runtime, recovery, and failure semantics
        run: spikes/fs05-runtime/verify.sh "foliopath-fs05:${GITHUB_SHA}-${{ matrix.arch }}"
      - name: Record native dependency versions and image size
        run: |
          image="foliopath-fs05:${GITHUB_SHA}-${{ matrix.arch }}"
          docker run --rm --entrypoint ffmpeg "$image" -hide_banner -version
          docker run --rm --entrypoint sh "$image" -c \
            "dpkg-query -W ffmpeg libvips42"
          docker image inspect "$image" \
            --format 'platform={{.Os}}/{{.Architecture}} size={{.Size}} digest={{.Id}}'

  application-smoke:
    name: Application smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Exercise the real application process and test image
        env:
          FOLIOPATH_SMOKE_IMAGE: foliopath-application-smoke:${{ github.sha }}-${{ matrix.arch }}
        run: make test-e2e

  release-candidate:
    name: Release candidate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build and verify the native production candidate
        env:
          FOLIOPATH_RELEASE_IMAGE: foliopath-release:${{ github.sha }}-${{ matrix.arch }}
          FOLIOPATH_RELEASE_EVIDENCE: ${{ runner.temp }}/release-image-${{ matrix.arch }}.json
          FOLIOPATH_RELEASE_EXPECTED_ARCH: ${{ matrix.arch }}
          FOLIOPATH_RELEASE_COMMIT: ${{ github.sha }}
          FOLIOPATH_RELEASE_RUN_ID: ${{ github.run_id }}
          FOLIOPATH_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          FOLIOPATH_RELEASE_PROVENANCE: ${{ runner.temp }}/release-provenance-${{ matrix.arch }}.json
          FOLIOPATH_PROVENANCE_BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FOLIOPATH_PROVENANCE_INVOCATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: make test-release-image
      - name: Upload native release image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ github.sha }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release-image-${{ matrix.arch }}.json
            ${{ runner.temp }}/release-provenance-${{ matrix.arch }}.json
          if-no-files-found: error
          include-hidden-files: false

  storyboard-candidate:
    name: Storyboard candidate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fixture and evidence tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg jq
      - name: Exercise the native storyboard candidate
        env:
          FOLIOPATH_RELEASE_IMAGE: foliopath-storyboard:${{ github.sha }}-${{ matrix.arch }}
          FOLIOPATH_STORYBOARD_EVIDENCE: ${{ runner.temp }}/storyboard-evidence-${{ matrix.arch }}.json
          FOLIOPATH_STORYBOARD_EXPECTED_ARCH: ${{ matrix.arch }}
          FOLIOPATH_STORYBOARD_RUN_ATTEMPT: ${{ github.run_attempt }}
          FOLIOPATH_STORYBOARD_RUN_ID: ${{ github.run_id }}
          FOLIOPATH_STORYBOARD_SKIP_BROWSER: "1"
          FOLIOPATH_STORYBOARD_SOURCE_COMMIT: ${{ github.sha }}
        run: make test-storyboard-vertical
      - name: Upload native storyboard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storyboard-evidence-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/storyboard-evidence-${{ matrix.arch }}.json
          if-no-files-found: error
          include-hidden-files: false

  storyboard-evidence:
    name: Verify paired storyboard evidence
    needs: storyboard-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Download paired native evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: storyboard-evidence-${{ github.sha }}-*
          path: ${{ runner.temp }}/storyboard-evidence
          merge-multiple: true
      - name: Verify source, runtime, layout, and decoded pixels match
        run: |
          make verify-storyboard-evidence \
            EVIDENCE_DIR="${RUNNER_TEMP}/storyboard-evidence" \
            RELEASE_SHA="${GITHUB_SHA}" \
            SUMMARY_FILE="${RUNNER_TEMP}/storyboard-paired-evidence.json"
      - name: Upload verified paired storyboard summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storyboard-paired-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/storyboard-paired-evidence.json
          if-no-files-found: error
          include-hidden-files: false

  release-capacity:
    name: Release capacity (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Run the native production candidate capacity gate
        env:
          FOLIOPATH_RELEASE_IMAGE: foliopath-release-capacity:${{ github.sha }}-${{ matrix.arch }}
          FOLIOPATH_CAPACITY_BUILD_IMAGE: "1"
          FOLIOPATH_CAPACITY_SCAN_BUDGET_MS: "180000"
          FOLIOPATH_CAPACITY_WORK_ROOT: ${{ runner.temp }}
          FOLIOPATH_CAPACITY_METRICS_OUTPUT: ${{ runner.temp }}/release-capacity-${{ matrix.arch }}.json
        run: make release-capacity
      - name: Upload native capacity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-capacity-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-capacity-${{ matrix.arch }}.json
          if-no-files-found: error
          include-hidden-files: false

  web-browser:
    name: Authentication and release browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Node dependencies
        run: npm ci --prefix web
      - name: Install the locked browser runners
        run: npm exec --prefix web -- playwright install --with-deps chromium firefox webkit
      - name: Exercise authentication, library, scan, browse, preview, and safe readiness states
        run: make test-web-e2e
      - name: Exercise Firefox, WebKit, and the visual regression baseline
        run: make test-web-release-e2e
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            web/playwright-report
            test-results/playwright
          if-no-files-found: ignore
          include-hidden-files: false

  supply-chain:
    name: Candidate SBOM, vulnerabilities, and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the production candidate image
        run: |
          docker build -f Dockerfile \
            -t "foliopath-release:${GITHUB_SHA}-supply-chain" \
            --build-arg VERSION="${GITHUB_SHA}" .
      - name: Generate and validate SPDX SBOMs
        run: |
          scripts/generate-sbom.sh \
            "foliopath-release:${GITHUB_SHA}-supply-chain" \
            "${RUNNER_TEMP}/supply-chain"
          jq -e '.packages | length > 0' \
            "${RUNNER_TEMP}/supply-chain/source.spdx.json"
          jq -e '.packages | length > 0' \
            "${RUNNER_TEMP}/supply-chain/npm.spdx.json"
          jq -e \
            '[.packages[].name] |
              index("foliopath-ffmpeg") != null and
              index("foliopath-expat") != null and
              index("foliopath-libvips") != null' \
            "${RUNNER_TEMP}/supply-chain/image.spdx.json"
      - name: Scan the candidate and reject findings with available fixes
        env:
          FOLIOPATH_VULNERABILITY_POLICY: fixed
        run: |
          scripts/scan-release-image.sh \
            "foliopath-release:${GITHUB_SHA}-supply-chain" \
            "${RUNNER_TEMP}/supply-chain"
      - name: Record codec build and packaged license evidence
        run: |
          image="foliopath-release:${GITHUB_SHA}-supply-chain"
          docker run --rm --entrypoint ffmpeg "$image" -hide_banner -buildconf
          scripts/collect-release-notices.sh \
            "$image" "${RUNNER_TEMP}/supply-chain/notices"
      - name: Upload immutable supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain
          if-no-files-found: error
          include-hidden-files: false
