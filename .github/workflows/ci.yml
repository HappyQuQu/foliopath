name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify formatting, architecture, contract, and vet
        run: make fmt-check lint
      - name: Run tests
        run: make test test-integration
      - name: Run race tests
        run: make test-race

  web-contract:
    name: Generated web contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Node dependencies
        run: npm ci --prefix web
      - name: Reject high-severity Node dependency findings
        run: npm audit --prefix web --audit-level=high
      - name: Verify generated SQL, API types, and the typed client boundary
        run: make generate-check web-check
      - name: Cross-check the OpenAPI document
        run: make openapi-lint
      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:api/openapi.yaml"; then
            git show "${BASE_SHA}:api/openapi.yaml" > "${RUNNER_TEMP}/openapi-base.yaml"
            make compatibility-check \
              OPENAPI_BASELINE="${RUNNER_TEMP}/openapi-base.yaml"
          else
            echo "Initial OpenAPI addition: no base-branch contract exists to compare."
          fi

  media-matrix:
    name: Synthetic media (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg webp
      - name: Run the synthetic media matrix
        run: tests/fixtures/media-matrix/verify.sh

  vips-spike:
    name: Govips spike (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache-dependency-path: spikes/fs03-vips/go.sum
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips-dev
          pkg-config --modversion vips
      - name: Run the bounded govips fixture
        working-directory: spikes/fs03-vips
        env:
          MALLOC_ARENA_MAX: "2"
        run: timeout 2m go test -count=1 -v ./...

  mount-boundary:
    name: Linux mount boundary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run isolated privileged probes
        run: |
          docker run --rm \
            --privileged \
            --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/src,readonly \
            --workdir /src \
            --env GOMODCACHE=/tmp/mod \
            --env GOCACHE=/tmp/cache \
            golang:1.26.4-bookworm \
            sh -c "go test -count=1 -tags fsboundary ./tests/integration \
              -run '^TestFS01Rejects.*BindMount$' &&
              go test -race -count=1 -tags fsboundary ./tests/integration \
              -run '^TestFS01Rejects.*BindMount$'"

  runtime-spike:
    name: Runtime and recovery (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build the native runtime spike image
        run: |
          docker build -f spikes/fs05-runtime/Dockerfile \
            -t "foliopath-fs05:${GITHUB_SHA}-${{ matrix.arch }}" \
            --build-arg VERSION="${GITHUB_SHA}" .
      - name: Verify runtime, recovery, and failure semantics
        run: spikes/fs05-runtime/verify.sh "foliopath-fs05:${GITHUB_SHA}-${{ matrix.arch }}"
      - name: Record native dependency versions and image size
        run: |
          image="foliopath-fs05:${GITHUB_SHA}-${{ matrix.arch }}"
          docker run --rm --entrypoint ffmpeg "$image" -hide_banner -version
          docker run --rm --entrypoint sh "$image" -c \
            "dpkg-query -W ffmpeg libvips42"
          docker image inspect "$image" \
            --format 'platform={{.Os}}/{{.Architecture}} size={{.Size}} digest={{.Id}}'

  application-smoke:
    name: Application smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Exercise the real application process and test image
        env:
          FOLIOPATH_SMOKE_IMAGE: foliopath-application-smoke:${{ github.sha }}-${{ matrix.arch }}
        run: make test-e2e

  supply-chain:
    name: SBOM and license evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the runtime spike image
        run: |
          docker build -f spikes/fs05-runtime/Dockerfile \
            -t "foliopath-fs05:${GITHUB_SHA}-sbom" \
            --build-arg VERSION="${GITHUB_SHA}" .
      - name: Generate and validate SPDX SBOMs
        run: |
          scripts/generate-sbom.sh \
            "foliopath-fs05:${GITHUB_SHA}-sbom" "${RUNNER_TEMP}/sbom"
          jq -e '.packages | length > 0' "${RUNNER_TEMP}/sbom/source.spdx.json"
          jq -e '.packages | length > 0' "${RUNNER_TEMP}/sbom/npm.spdx.json"
          jq -e \
            '[.packages[].name] | index("ffmpeg") != null and index("libvips42") != null' \
            "${RUNNER_TEMP}/sbom/image.spdx.json"
      - name: Record codec build and packaged license evidence
        run: |
          image="foliopath-fs05:${GITHUB_SHA}-sbom"
          docker run --rm --entrypoint ffmpeg "$image" -hide_banner -buildconf
          docker run --rm --entrypoint sh "$image" -c \
            "grep -E '^(Files:|License:)' /usr/share/doc/ffmpeg/copyright \
              /usr/share/doc/libvips42/copyright | head -80"
