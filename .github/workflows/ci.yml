name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify formatting, architecture, contract, and vet
        run: make fmt-check lint
      - name: Run tests
        run: make test test-integration
      - name: Run race tests
        run: make test-race

  web-contract:
    name: Generated web contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Node dependencies
        run: npm ci --prefix web
      - name: Reject high-severity Node dependency findings
        run: npm audit --prefix web --audit-level=high
      - name: Verify generated types and the typed client boundary
        run: make web-check
      - name: Cross-check the OpenAPI document
        run: make openapi-lint
      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:api/openapi.yaml"; then
            git show "${BASE_SHA}:api/openapi.yaml" > "${RUNNER_TEMP}/openapi-base.yaml"
            make compatibility-check \
              OPENAPI_BASELINE="${RUNNER_TEMP}/openapi-base.yaml"
          else
            echo "Initial OpenAPI addition: no base-branch contract exists to compare."
          fi

  media-matrix:
    name: Synthetic media (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg webp
      - name: Run the synthetic media matrix
        run: tests/fixtures/media-matrix/verify.sh

  mount-boundary:
    name: Linux mount boundary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run isolated privileged probes
        run: |
          docker run --rm \
            --privileged \
            --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/src,readonly \
            --workdir /src \
            --env GOMODCACHE=/tmp/mod \
            --env GOCACHE=/tmp/cache \
            golang:1.26.4-bookworm \
            sh -c "go test -count=1 -tags fsboundary ./tests/integration \
              -run '^TestFS01Rejects.*BindMount$' &&
              go test -race -count=1 -tags fsboundary ./tests/integration \
              -run '^TestFS01Rejects.*BindMount$'"
