name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: edge
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}-${{ inputs.image_tag || 'release' }}
  cancel-in-progress: true

env:
  IMAGE_NAME: evanqu/foliopath
  DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Update Docker Hub overview
        if: env.DOCKERHUB_DESCRIPTION_TOKEN != ''
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: README.md
          short-description: Read-only self-hosted photo and video browser for NAS libraries.

      - name: Skip Docker Hub overview sync
        if: env.DOCKERHUB_DESCRIPTION_TOKEN == ''
        run: echo "::notice title=Docker Hub overview skipped::Add DOCKERHUB_DESCRIPTION_TOKEN to sync README.md."
