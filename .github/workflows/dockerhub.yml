name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: edge
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}-${{ inputs.image_tag || 'release' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: evanqu/foliopath

jobs:
  release:
    name: Prepare, merge, and publish release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.result.outputs.release_created }}
      tag_name: ${{ steps.result.outputs.tag_name }}
      version: ${{ steps.result.outputs.version }}
      major: ${{ steps.result.outputs.major }}
      minor: ${{ steps.result.outputs.minor }}
      build_sha: ${{ steps.result.outputs.build_sha }}
    steps:
      - name: Update release pull request or create release
        id: prepare
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Automatically merge release pull request
        if: steps.prepare.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.prepare.outputs.pr }}
        shell: bash
        run: |
          pr_number="$(jq -er '.number' <<<"${PR_JSON}")"
          gh pr merge "${pr_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --delete-branch

      - name: Finalize automatically merged release
        id: finalize
        if: steps.prepare.outputs.prs_created == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Normalize release outputs
        id: result
        shell: bash
        env:
          PREPARE_CREATED: ${{ steps.prepare.outputs.release_created }}
          PREPARE_TAG: ${{ steps.prepare.outputs.tag_name }}
          PREPARE_VERSION: ${{ steps.prepare.outputs.version }}
          PREPARE_MAJOR: ${{ steps.prepare.outputs.major }}
          PREPARE_MINOR: ${{ steps.prepare.outputs.minor }}
          PREPARE_SHA: ${{ steps.prepare.outputs.sha }}
          FINALIZE_CREATED: ${{ steps.finalize.outputs.release_created }}
          FINALIZE_TAG: ${{ steps.finalize.outputs.tag_name }}
          FINALIZE_VERSION: ${{ steps.finalize.outputs.version }}
          FINALIZE_MAJOR: ${{ steps.finalize.outputs.major }}
          FINALIZE_MINOR: ${{ steps.finalize.outputs.minor }}
          FINALIZE_SHA: ${{ steps.finalize.outputs.sha }}
        run: |
          if [[ "${FINALIZE_CREATED}" == "true" ]]; then
            release_created=true
            tag_name="${FINALIZE_TAG}"
            version="${FINALIZE_VERSION}"
            major="${FINALIZE_MAJOR}"
            minor="${FINALIZE_MINOR}"
            build_sha="${FINALIZE_SHA}"
          elif [[ "${PREPARE_CREATED}" == "true" ]]; then
            release_created=true
            tag_name="${PREPARE_TAG}"
            version="${PREPARE_VERSION}"
            major="${PREPARE_MAJOR}"
            minor="${PREPARE_MINOR}"
            build_sha="${PREPARE_SHA}"
          else
            release_created=false
            tag_name=""
            version=""
            major=""
            minor=""
            build_sha="${GITHUB_SHA}"
          fi
          {
            echo "release_created=${release_created}"
            echo "tag_name=${tag_name}"
            echo "version=${version}"
            echo "major=${major}"
            echo "minor=${minor}"
            echo "build_sha=${build_sha}"
          } >> "${GITHUB_OUTPUT}"

  prepare:
    name: Prepare immutable image plan
    needs:
      - release
    if: >-
      always() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.image_tag == 'intelligent-media-native-evidence')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ needs.release.outputs.build_sha || github.sha }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.build_sha || github.sha }}

      - name: Resolve embedded version
        id: version
        shell: bash
        env:
          RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ needs.release.outputs.build_sha || github.sha }}
        run: |
          if [[ "${RELEASE_CREATED}" == "true" ]]; then
            value="${RELEASE_TAG}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            value="${DISPATCH_TAG}"
          else
            value="${REF_NAME}"
          fi
          {
            echo "value=${value}"
            echo "short_sha=${BUILD_SHA:0:7}"
          } >> "${GITHUB_OUTPUT}"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.build_sha || github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}

      - name: Record immutable image plan
        env:
          SOURCE: ${{ needs.release.outputs.build_sha || github.sha }}
          VERSION: ${{ steps.version.outputs.value }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: python3 scripts/native_release.py plan --output "${RUNNER_TEMP}/image-plan.json"

      - name: Upload image plan
        uses: actions/upload-artifact@v4
        with:
          name: image-plan
          path: ${{ runner.temp }}/image-plan.json
          if-no-files-found: error
          retention-days: 7

  images:
    name: Build and verify native images
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/native-images.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    name: Publish verified multi-platform image
    needs: [prepare, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image plan
        uses: actions/download-artifact@v4
        with:
          name: image-plan
          path: ${{ runner.temp }}/image-plan

      - name: Download both verified digests
        uses: actions/download-artifact@v4
        with:
          pattern: verified-digest-*
          path: ${{ runner.temp }}/verified-digests
          merge-multiple: true

      - name: Publish verified digests without rebuilding
        run: |
          python3 scripts/native_release.py publish \
            --plan "${RUNNER_TEMP}/image-plan/image-plan.json" \
            --records "${RUNNER_TEMP}/verified-digests"

      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: README.dockerhub.md
          short-description: Read-only self-hosted photo and video browser for NAS libraries.

  intelligent-media-native-evidence:
    name: Run intelligent media native evidence without publishing
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.image_tag == 'intelligent-media-native-evidence'
    permissions:
      contents: read
    uses: ./.github/workflows/intelligent-media-native.yml
